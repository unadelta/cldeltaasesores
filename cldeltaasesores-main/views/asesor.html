<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asesores - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-people me-2"></i>Módulo de Asesores</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo Asesor
                </button>
            </div>
        </div>

        <!-- TABLA DE ASESORES -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol ID</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAsesores">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA CREAR / EDITAR ASESOR -->
    <div class="modal fade" id="modalAsesor" tabindex="-1" aria-labelledby="modalAsesorLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAsesor" onsubmit="guardarAsesor(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalAsesorLabel">Registrar Asesor</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="asesorId">

                        <div class="mb-3">
                            <label for="cedula" class="form-label fw-semibold">Cédula</label>
                            <input type="text" class="form-control" id="cedula" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-semibold">Usuario</label>
                            <input type="text" class="form-control" id="usuario" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="clave" required autocomplete="new-password">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="rol_id" class="form-label fw-semibold">Rol del Asesor</label>
                            <select class="form-select" id="rol_id" required>
                                <option value="" disabled selected>Seleccione un rol...</option>
                                <option value="1">Administrador</option>
                                <option value="2">Usuario</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalAsesorInstance = null;

        // Inicialización única al cargar el DOM
        document.addEventListener("DOMContentLoaded", async() => {
            modalAsesorInstance = new bootstrap.Modal(document.getElementById('modalAsesor'));
            await verificarSesionYCargar();
        });

        async function verificarSesionYCargar() {
            try {
                // 1. Cargar el Navbar dinámicamente
                const navResponse = await fetch('/views/navbar.html');
                const navHtml = await navResponse.text();
                document.getElementById('navbar-container').innerHTML = navHtml;

                // 2. Verificar sesión y pintar nombre de usuario
                const sesionRes = await fetch('/api/user-session');
                const sesionData = await sesionRes.json();

                if (sesionData.authenticated) {
                    const spanUsuario = document.getElementById('nombreUsuario');
                    if (spanUsuario) {
                        spanUsuario.textContent = sesionData.user.nombre || sesionData.user.usuario;
                    }
                    // 3. Cargar los datos de la tabla (Ahora sí se ejecutará)
                    await cargarAsesores();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error crítico al verificar sesión o cargar navbar", err);
            }
        }

        async function cargarAsesores() {
            try {
                const res = await fetch('/api/asesores');
                const data = await res.json();
                const tbody = document.getElementById('tablaAsesores');
                tbody.innerHTML = '';

                if (data.success && data.data && data.data.length > 0) {
                    data.data.forEach(asesor => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${asesor.id}</td>
                                <td>${asesor.cedula}</td>
                                <td>${asesor.nombre}</td>
                                <td>${asesor.usuario}</td>
                                <td>${asesor.email}</td>
                                <td>${asesor.rol_id}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${asesor.id}, '${asesor.cedula}', '${asesor.nombre}', '${asesor.usuario}', '${asesor.email}', ${asesor.rol_id})">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarAsesor(${asesor.id})">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No hay asesores registrados.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar asesores", err);
                document.getElementById('tablaAsesores').innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error al conectar con el servidor.</td></tr>`;
            }
        }

        function abrirModalCrear() {
            document.getElementById('formAsesor').reset();
            document.getElementById('asesorId').value = '';
            document.getElementById('modalAsesorLabel').textContent = 'Registrar Asesor';
            modalAsesorInstance.show();
        }

        function abrirModalEditar(id, cedula, nombre, usuario, email, rol_id) {
            document.getElementById('formAsesor').reset();
            document.getElementById('asesorId').value = id;
            document.getElementById('cedula').value = cedula;
            document.getElementById('nombre').value = nombre;
            document.getElementById('usuario').value = usuario;
            document.getElementById('email').value = email;
            document.getElementById('rol_id').value = rol_id;
            document.getElementById('modalAsesorLabel').textContent = 'Editar Asesor';
            modalAsesorInstance.show();
        }

        async function guardarAsesor(e) {
            e.preventDefault();
            const btnGuardar = document.getElementById('btnGuardar');
            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Guardando...';

            const id = document.getElementById('asesorId').value;
            const bodyData = {
                cedula: document.getElementById('cedula').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                usuario: document.getElementById('usuario').value.trim(),
                clave: document.getElementById('clave').value.trim(),
                email: document.getElementById('email').value.trim(),
                rol_id: document.getElementById('rol_id').value.trim()
            };

            try {
                const res = await fetch(id ? `/api/asesores/${id}` : '/api/asesores', {
                    method: id ? 'PUT' : 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await res.json();
                if (data.success) {
                    modalAsesorInstance.hide();
                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: data.message
                    });
                    await cargarAsesores();
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.message
                    });
                }
            } catch (err) {
                console.error("Error al guardar", err);
                Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar';
            }
        }

        async function eliminarAsesor(id) {
            const result = await Swal.fire({
                title: '¿Está seguro?',
                text: "¡No podrá revertir esta acción!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'Sí, eliminar'
            });

            if (result.isConfirmed) {
                try {
                    const res = await fetch(`/api/asesores/${id}`, {
                        method: 'DELETE'
                    });
                    const data = await res.json();
                    if (data.success) {
                        Swal.fire('Eliminado', data.message, 'success');
                        await cargarAsesores();
                    } else {
                        Swal.fire('Error', data.message, 'error');
                    }
                } catch (err) {
                    console.error("Error al eliminar", err);
                    Swal.fire('Error', 'No se pudo conectar con el servidor', 'error');
                }
            }
        }

        function cerrarSesion() {
            // Asegúrate de llamar al endpoint de logout si existe, o simplemente redirigir
            window.location.href = '/';
        }
    </script>
</body>

</html>
