<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Estilo para la imagen de fondo de la fachada */
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/jpg/fachadaUna.jpg') no-repeat center 80% fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Empuja el contenido hacia abajo */
        }
        /* Estilo de la tarjeta de bienvenida con opacidad */
        
        .card-welcome {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body>

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL: Alineado a la derecha (justify-content-end) y abajo (mb-5) -->
    <div class="container mb-5">
        <div class="row justify-content-end">
            <div class="col-md-7">
                <div class="card border-0 shadow-lg p-4 rounded-4 card-welcome">
                    <h3 class="fw-bold text-primary mb-2">Bienvenido al Panel de Control</h3>
                    <p class="text-secondary fs-6 mb-0">Seleccione una opción del menú superior para gestionar los registros del sistema.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Cargar datos de la sesión activa al entrar al dashboard y mostrar el nombre en el navbar derecho
        document.addEventListener("DOMContentLoaded", async() => {
            try {
                const res = await fetch('/api/user-session');
                const data = await res.json();

                if (data.authenticated) {
                    const spanUsuario = document.getElementById('nombreUsuario');
                    if (spanUsuario) {
                        spanUsuario.textContent = data.user.nombre || data.user.usuario;
                    }
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error al verificar la sesión", err);
            }
        });

        // Función para cerrar sesión
        function cerrarSesion() {
            window.location.href = '/';
        }

        // Cargar el HTML del Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // Consultar y pintar el nombre del usuario en sesión después de cargar el menú
                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });
    </script>
</body>

</html>
