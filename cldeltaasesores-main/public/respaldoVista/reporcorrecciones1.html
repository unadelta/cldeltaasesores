<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Control de Correcciones - UNA Delta Amacuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Configuración de página: Carta Horizontal y márgenes */
        
        @page {
            size: letter landscape;
            margin: 10mm;
        }
        
        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Contenedor que simula la vista previa en pantalla */
        
        .page-container {
            background: white;
            width: 279mm;
            min-height: 215mm;
            margin: 15px auto;
            padding: 12mm 15mm;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
        }
        /* Ocultar barra de acciones y controles de filtro al imprimir */
        
        @media print {
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .page-container {
                box-shadow: none;
                margin: 0;
                padding: 5mm 10mm;
                width: 100%;
                min-height: 100vh;
            }
        }
        /* Encabezado */
        
        .header-container {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .logo-una {
            max-height: 55px;
            object-fit: contain;
        }
        
        .institution-title h4 {
            margin: 0;
            font-weight: bold;
            color: #0d6efd;
            font-size: 1.2rem;
        }
        
        .institution-title h5 {
            margin: 2px 0 0 0;
            color: #495057;
            font-size: 1rem;
            font-weight: 600;
        }
        /* Estilo de la tabla y filas intercaladas */
        
        .table-report {
            font-size: 0.85rem;
            width: 100%;
            margin-bottom: auto;
        }
        
        .table-report th {
            background-color: #0d6efd !important;
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: 600;
        }
        
        .table-report td {
            padding: 7px 10px;
            vertical-align: middle;
            border-color: #dee2e6;
        }
        /* Filas intercaladas (Efecto cebra) */
        
        .table-report tbody tr:nth-child(odd) {
            background-color: #fdfdfd;
        }
        
        .table-report tbody tr:nth-child(even) {
            background-color: #f1f4f9;
        }
        /* Pie de página con firmas y paginación en 4 columnas alineadas */
        
        .report-footer {
            margin-top: 20px;
            padding-top: 10px;
            border-top: 1px solid #ced4da;
            font-size: 0.75rem;
        }
        
        .signature-line {
            border-top: 1px solid #333;
            width: 85%;
            margin: 22px auto 3px auto;
        }
    </style>
</head>

<body>

    <!-- BARRA DE ACCIONES Y FILTRO DE FECHAS (No se imprime) -->
    <div class="container my-3 no-print">
        <div class="card shadow-sm border-0 p-3 bg-white">
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <a href="/dashboard" class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-arrow-left me-1"></i> Volver al Dashboard</a>
                </div>
                <div class="col-md-3">
                    <label for="fechaDesde" class="form-label small fw-semibold mb-1">Fecha Desde:</label>
                    <input type="date" id="fechaDesde" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label for="fechaHasta" class="form-label small fw-semibold mb-1">Fecha Hasta:</label>
                    <input type="date" id="fechaHasta" class="form-control form-control-sm">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button onclick="cargarReporteConFiltro()" class="btn btn-primary btn-sm w-100"><i class="bi bi-filter me-1"></i> Generar Reporte</button>
                    <button onclick="window.print()" class="btn btn-success btn-sm" title="Imprimir"><i class="bi bi-printer-fill"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DINÁMICO DE PÁGINAS -->
    <div id="contenedorPaginas">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Cargando registros por defecto...</p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let nombreAsesorActual = "Asesor";

        document.addEventListener("DOMContentLoaded", async() => {
            await cargarSesionYDatos();
        });

        async function cargarSesionYDatos() {
            try {
                // Obtener datos del usuario logueado
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated && dataUser.user) {
                    nombreAsesorActual = dataUser.user.nombre || "Asesor";
                }
            } catch (err) {
                console.error("Error al obtener sesión:", err);
            }

            // Carga por defecto inmediata al entrar al reporte (sin filtros de fecha)
            await cargarReporteConFiltro();
        }
        /*
                async function cargarReporteConFiltro() {
                    const desde = document.getElementById('fechaDesde').value;
                    const hasta = document.getElementById('fechaHasta').value;

                    let url = '/api/reporasesoria';
                    // Solo agrega los parámetros si ambos campos tienen fecha seleccionada
                    if (desde && hasta) {
                        url += `?fecha_desde=${desde}&fecha_hasta=${hasta}`;
                    }

                    const contenedor = document.getElementById('contenedorPaginas');
                    contenedor.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="text-muted mt-2">Cargando datos...</p></div>`;

                    try {
                        const res = await fetch(url);
                        const data = await res.json();

                        const lista = data.success ? data.data : (Array.isArray(data) ? data : []);
                        generarPaginasReporte(lista);

                    } catch (err) {
                        console.error("Error al cargar reporte:", err);
                        contenedor.innerHTML = `<div class="alert alert-danger text-center m-4">Error al conectar con el servidor para generar el reporte.</div>`;
                    }
                }
        */

        async function cargarReporteConFiltro() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;

            // CAMBIA '/api/reporasesoria' POR '/api/reporcorrecciones'
            let url = '/api/reporcorrecciones';

            if (desde && hasta) {
                url += `?fecha_desde=${desde}&fecha_hasta=${hasta}`;
            }

            const contenedor = document.getElementById('contenedorPaginas');
            contenedor.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="text-muted mt-2">Cargando datos...</p></div>`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                const lista = data.success ? data.data : (Array.isArray(data) ? data : []);
                generarPaginasReporte(lista);

            } catch (err) {
                console.error("Error al cargar reporte:", err);
                contenedor.innerHTML = `<div class="alert alert-danger text-center m-4">Error al conectar con el servidor para generar el reporte.</div>`;
            }
        }


        function generarPaginasReporte(datos) {
            const contenedor = document.getElementById('contenedorPaginas');
            contenedor.innerHTML = '';

            if (datos.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-muted py-5 bg-white shadow-sm m-4 rounded">No se encontraron registros de correcciones para este asesor.</div>`;
                return;
            }

            // Dividir estrictamente en bloques de 20 ítems por página
            const itemsPorPagina = 20;
            const totalPaginas = Math.ceil(datos.length / itemsPorPagina);

            for (let i = 0; i < totalPaginas; i++) {
                const inicio = i * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const chunk = datos.slice(inicio, fin);

                let filasHTML = '';
                chunk.forEach((item) => {
                    let fechaFormateada = item.fecha || 'N/D';
                    if (fechaFormateada.includes('T')) {
                        fechaFormateada = fechaFormateada.replace('T', ' ').substring(0, 19);
                    }

                    filasHTML += `
                        <tr>
                            <td class="text-center fw-semibold">${item.id}</td>
                            <td class="text-center">${item.cedula_alumno || ''}</td>
                            <td>${item.nombre_alumno || ''}</td>
                            <td class="text-center"><span class="badge bg-light text-dark border">${item.codigo_carrera || ''}</span></td>
                            <td class="text-center"><span class="badge bg-secondary">${item.codigo_materia || ''}</span></td>
                            <td class="text-center">${item.tipo_correccion || ''}</td>
                            <td class="text-center">${fechaFormateada}</td>
                        </tr>
                    `;
                });

                const paginaDiv = document.createElement('div');
                paginaDiv.className = 'page-container';
                paginaDiv.innerHTML = `
                    <div>
                        <!-- ENCABEZADO -->
                        <div class="row align-items-center header-container">
                            <div class="col-8 d-flex align-items-center">
                                <img src="/jpg/logouna.jpg" alt="Logo UNA" class="logo-una me-3" onerror="this.style.display='none'">
                                <div class="institution-title">
                                    <h4>Universidad Nacional Abierta</h4>
                                    <h5>Centro Local Delta Amacuro</h5>
                                </div>
                            </div>
                            <div class="col-4 text-end">
                                <span class="text-primary fw-bold fs-6">CONTROL DE CORRECCIONES</span>
                                <div class="text-muted" style="font-size: 0.75rem;">Emitido: ${new Date().toLocaleDateString()}</div>
                            </div>
                        </div>

                        <!-- TABLA DE DATOS -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-report align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 5%;">id</th>
                                        <th style="width: 14%;">cedula_alumno</th>
                                        <th style="width: 25%;">nombre_alumno</th>
                                        <th style="width: 11%;">codigo_carrera</th>
                                        <th style="width: 11%;">codigo_materia</th>
                                        <th style="width: 17%;">tipo_correccion</th>
                                        <th style="width: 17%;">fecha</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- PIE DE PÁGINA CON 4 COLUMNAS ALINEADAS -->
                    <div class="report-footer">
                        <div class="row align-items-end text-center">
                            <!-- 1. Firma Asesor de la sesión -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold text-truncate" style="font-size: 0.75rem;">${nombreAsesorActual}</div>
                                <div class="text-muted" style="font-size: 0.7rem;">Asesor</div>
                            </div>

                            <!-- 2. Firma Dra. Yovinsa Salazar -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold" style="font-size: 0.75rem;">Dra. Yovinsa Salazar</div>
                                <div class="text-muted" style="font-size: 0.7rem;">Jefa de la Unidad Académica</div>
                            </div>

                            <!-- 3. Firma Dr. Edgar Ramírez -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold" style="font-size: 0.75rem;">Dr. Edgar Ramírez</div>
                                <div class="text-muted" style="font-size: 0.65rem;">Coordinador del centro local Delta Amacuro</div>
                            </div>

                            <!-- 4. Número de Página Alineado -->
                            <div class="col-3">
                                <div class="signature-line" style="visibility: hidden;"></div>
                                <div class="fw-bold text-dark" style="font-size: 0.75rem;">Página ${i + 1} de ${totalPaginas}</div>
                                <div class="text-muted" style="font-size: 0.65rem; visibility: hidden;">Paginación</div>
                            </div>
                        </div>
                    </div>
                `;

                contenedor.appendChild(paginaDiv);
            }
        }
    </script>
</body>

</html>
