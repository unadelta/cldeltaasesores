<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asesores - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard">
                <img src="/jpg/logouna.jpg" alt="Logo UNA" height="35" class="bg-white rounded p-1 me-2 shadow-sm" onerror="this.style.display='none'">
                <span>Asesores UNA</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Inicio</a>
                    </li>

                    <!-- MENÚ DESPLEGABLE: ADMINISTRADOR -->
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold active" aria-current="page" href="#" id="navbarDropdownAdmin" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-shield-lock me-1"></i> Administrador
                        </a>
                        <ul class="dropdown-menu shadow" aria-labelledby="navbarDropdownAdmin">
                            <li><a class="dropdown-item active" href="/asesor"><i class="bi bi-people me-2"></i>Asesores</a></li>
                            <li><a class="dropdown-item" href="/carrera"><i class="bi bi-mortarboard me-2"></i>Carreras</a></li>
                            <li><a class="dropdown-item" href="/materia"><i class="bi bi-book me-2"></i>Materias</a></li>
                            <li><a class="dropdown-item" href="/tarea"><i class="bi bi-check2-square me-2"></i>Tareas</a></li>
                        </ul>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link text-white" href="/alumno"><i class="bi bi-mortarboard-fill me-1"></i> Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/asesoria"><i class="bi bi-journal-text me-1"></i> Asesorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/tarea"><i class="bi bi-list-task me-1"></i> Tareas</a>
                    </li>
                </ul>

                <!-- SECCIÓN DERECHA: NOMBRE DE USUARIO Y CERRAR SESIÓN -->
                <div class="d-flex align-items-center text-white ms-auto">
                    <span class="me-2"><i class="bi bi-person-circle"></i></span>
                    <span id="nombreUsuario" class="me-3 fw-semibold">Cargando...</span>
                    <button onclick="cerrarSesion()" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-people me-2"></i>Módulo de Asesores</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo Asesor
                </button>
            </div>
        </div>

        <!-- ALERTA DINÁMICA -->
        <div id="alertaAsesor" class="alert d-none" role="alert"></div>

        <!-- TABLA DE ASESORES -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Usuario</th>
                                <th>Email</th>
                                <th>Rol ID</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAsesores">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA CREAR / EDITAR ASESOR -->
    <div class="modal fade" id="modalAsesor" tabindex="-1" aria-labelledby="modalAsesorLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAsesor" onsubmit="guardarAsesor(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalAsesorLabel">Registrar Asesor</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="asesorId">

                        <div class="mb-3">
                            <label for="cedula" class="form-label fw-semibold">Cédula</label>
                            <input type="text" class="form-control" id="cedula" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="usuario" class="form-label fw-semibold">Usuario</label>
                            <input type="text" class="form-control" id="usuario" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="clave" class="form-label fw-semibold">Contraseña</label>
                            <input type="password" class="form-control" id="clave" required autocomplete="new-password">
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" required autocomplete="off">
                        </div>



                        <div class="mb-3">
                            <label for="rol_id" class="form-label fw-semibold">Rol del Asesor</label>
                            <select class="form-select" id="rol_id" required>
                             <option value="" disabled selected>Seleccione un rol...</option>
                             <option value="1">Administrador</option>
                              <option value="2">Usuario</option>
                            </select>
                        </div>






                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalAsesorInstance = null;

        document.addEventListener("DOMContentLoaded", async() => {
            modalAsesorInstance = new bootstrap.Modal(document.getElementById('modalAsesor'));
            await verificarSesionYCargar();
        });

        async function verificarSesionYCargar() {
            try {
                const res = await fetch('/api/user-session');
                const data = await res.json();

                if (data.authenticated) {
                    document.getElementById('nombreUsuario').textContent = data.user.nombre;
                    await cargarAsesores();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error al verificar sesión", err);
            }
        }

        async function cargarAsesores() {
            try {
                const res = await fetch('/api/asesores');
                const data = await res.json();
                const tbody = document.getElementById('tablaAsesores');
                tbody.innerHTML = '';

                if (data.success && data.data.length > 0) {
                    data.data.forEach(asesor => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${asesor.id}</td>
                                <td>${asesor.cedula}</td>
                                <td>${asesor.nombre}</td>
                                <td>${asesor.usuario}</td>
                                <td>${asesor.email}</td>
                                <td>${asesor.rol_id}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${asesor.id}, '${asesor.cedula}', '${asesor.nombre}', '${asesor.usuario}', '${asesor.email}', ${asesor.rol_id})" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarAsesor(${asesor.id})" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No hay asesores registrados.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar asesores", err);
            }
        }

        function abrirModalCrear() {
            document.getElementById('formAsesor').reset();
            document.getElementById('asesorId').value = '';
            document.getElementById('modalAsesorLabel').textContent = 'Registrar Asesor';
            modalAsesorInstance.show();
        }

        function abrirModalEditar(id, cedula, nombre, usuario, email, rol_id) {
            document.getElementById('formAsesor').reset();
            document.getElementById('asesorId').value = id;
            document.getElementById('cedula').value = cedula;
            document.getElementById('nombre').value = nombre;
            document.getElementById('usuario').value = usuario;
            document.getElementById('email').value = email;
            document.getElementById('rol_id').value = rol_id;
            document.getElementById('modalAsesorLabel').textContent = 'Editar Asesor';
            modalAsesorInstance.show();
        }

        async function guardarAsesor(e) {
            e.preventDefault();
            const id = document.getElementById('asesorId').value;
            const cedula = document.getElementById('cedula').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const usuario = document.getElementById('usuario').value.trim();
            const clave = document.getElementById('clave').value.trim();
            const email = document.getElementById('email').value.trim();
            const rol_id = document.getElementById('rol_id').value.trim();

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/asesores/${id}` : '/api/asesores';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        cedula,
                        nombre,
                        usuario,

                        clave,
                        email,
                        rol_id
                    })
                });

                const data = await res.json();
                if (data.success) {
                    modalAsesorInstance.hide();
                    mostrarAlerta(data.message, 'success');
                    await cargarAsesores();
                } else {
                    mostrarAlerta(data.message || 'Error al guardar', 'danger');
                }
            } catch (err) {
                mostrarAlerta('Error de conexión con el servidor', 'danger');
            }
        }

        async function eliminarAsesor(id) {
            if (!confirm('¿Está seguro de que desea eliminar este asesor?')) return;

            try {
                const res = await fetch(`/api/asesores/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (data.success) {
                    mostrarAlerta(data.message, 'success');
                    await cargarAsesores();
                } else {
                    mostrarAlerta(data.message || 'Error al eliminar', 'danger');
                }
            } catch (err) {
                mostrarAlerta('Error de conexión con el servidor', 'danger');
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alertaAsesor');
            alerta.className = `alert alert-${tipo}`;
            alerta.textContent = mensaje;
            alerta.classList.remove('d-none');
            setTimeout(() => alerta.classList.add('d-none'), 4000);
        }

        function cerrarSesion() {
            window.location.href = '/';
        }
    </script>
</body>

</html>
