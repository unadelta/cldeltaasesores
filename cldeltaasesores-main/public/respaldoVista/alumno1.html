<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard">
                <img src="/jpg/logouna.jpg" alt="Logo UNA" height="35" class="bg-white rounded p-1 me-2 shadow-sm" onerror="this.style.display='none'">
                <span>Asesores UNA</span>
            </a>

            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Inicio</a></li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white fw-semibold" href="#" data-bs-toggle="dropdown">Administrador</a>
                        <ul class="dropdown-menu shadow">
                            <li><a class="dropdown-item" href="/asesor">Asesores</a></li>
                            <li><a class="dropdown-item" href="/carrera">Carreras</a></li>
                            <li><a class="dropdown-item" href="/materia">Materias</a></li>
                            <li><a class="dropdown-item" href="/tarea">Tareas</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/alumno"><i class="bi bi-mortarboard-fill me-1"></i> Alumnos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/asesoria"><i class="bi bi-journal-text me-1"></i> Asesorias</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="/tarea"><i class="bi bi-list-task me-1"></i> Tareas</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center text-white ms-auto">
                    <span class="me-2"><i class="bi bi-person-circle"></i></span>
                    <span id="nombreUsuario" class="me-3 fw-semibold">Cargando...</span>
                    <button onclick="window.location.href='/'" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i> Salir
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-mortarboard-fill me-2"></i>Módulo de Alumnos</h3>
            </div>
            <div class="col-sm-6 text-sm-end">
                <button class="btn btn-success" onclick="abrirModal()">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo Alumno
                </button>
            </div>
        </div>

        <!-- BUSCADOR POR CÉDULA -->
        <div class="card border-0 shadow-sm mb-3">
            <div class="card-body">
                <div class="input-group">
                    <span class="input-group-text bg-primary text-white"><i class="bi bi-search"></i></span>
                    <input type="text" id="busquedaCedula" class="form-control" placeholder="Buscar por número de cédula..." onkeyup="filtrarAlumnos()">
                </div>
            </div>
        </div>

        <!-- TABLA DE ALUMNOS -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre Completo</th>
                                <th>Código Carrera</th>
                                <th>Descripción de Carrera</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAlumnos">
                            <tr>
                                <td colspan="5" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVO ALUMNO -->
    <div class="modal fade" id="modalAlumno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAlumno" onsubmit="guardarAlumno(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title">Registrar Nuevo Alumno</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">

                        <div class="mb-3">
                            <label for="cedula" class="form-label fw-semibold">Cédula</label>
                            <div class="input-group">
                                <select class="form-select" id="nacionalidad" style="max-width: 90px;" required>
                                <option value="V">V</option>
                                <option value="E">E</option>
                                 </select>
                                <span class="input-group-text">-</span>
                                <input type="text" class="form-control" id="numeroCedula" placeholder="Ej: 12345678" required autocomplete="off">
                            </div>
                        </div>





                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombre" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="selectCarrera" class="form-label fw-semibold">Código de Carrera</label>
                            <select id="selectCarrera" class="form-select" onchange="actualizarDescripcion()" required>
                                <option value="">Seleccione un código...</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="descCarrera" class="form-label fw-semibold">Descripción de la Carrera</label>
                            <input type="text" class="form-control bg-light" id="descCarrera" readonly required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalInstance = null;
        let listaCarreras = [];

        document.addEventListener("DOMContentLoaded", async() => {
            modalInstance = new bootstrap.Modal(document.getElementById('modalAlumno'));
            await verificarSesionYCargar();
        });

        async function verificarSesionYCargar() {
            try {
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated) {
                    document.getElementById('nombreUsuario').textContent = dataUser.user.nombre;
                } else {
                    window.location.href = '/';
                    return;
                }

                // Cargar carreras para el combobox
                const resCarreras = await fetch('/api/carreras');
                const dataCarreras = await resCarreras.json();
                if (dataCarreras.success) {
                    listaCarreras = dataCarreras.data;
                    const select = document.getElementById('selectCarrera');
                    listaCarreras.forEach(c => {
                        select.innerHTML += `<option value="${c.codigo}">${c.codigo} - ${c.nombre_carrera}</option>`;
                    });
                }

                await cargarAlumnos();
            } catch (err) {
                console.error("Error al inicializar", err);
            }
        }

        async function cargarAlumnos() {
            try {
                const res = await fetch('/api/alumnos');
                const data = await res.json();
                const tbody = document.getElementById('tablaAlumnos');
                tbody.innerHTML = '';

                if (data.success && data.data.length > 0) {
                    data.data.forEach(a => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${a.cedula}</td>
                                <td>${a.nombre}</td>
                                <td><span class="badge bg-secondary">${a.codigo_carrera}</span></td>
                                <td>${a.descripcion_carrera}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarAlumno('${a.cedula}')" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No hay alumnos registrados.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar alumnos", err);
            }
        }

        function actualizarDescripcion() {
            const codigoSeleccionado = document.getElementById('selectCarrera').value;
            const carreraEncontrada = listaCarreras.find(c => c.codigo === codigoSeleccionado);
            document.getElementById('descCarrera').value = carreraEncontrada ? carreraEncontrada.nombre_carrera : '';
        }

        function abrirModal() {
            document.getElementById('formAlumno').reset();
            document.getElementById('descCarrera').value = '';
            modalInstance.show();
        }

        async function guardarAlumno(e) {
            e.preventDefault();
            const data = {
                cedula: document.getElementById('cedula').value.trim(),
                nombre: document.getElementById('nombre').value.trim(),
                codigo_carrera: document.getElementById('selectCarrera').value,
                descripcion_carrera: document.getElementById('descCarrera').value.trim()
            };

            try {
                const res = await fetch('/api/alumnos', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (result.success) {
                    modalInstance.hide();
                    await cargarAlumnos();
                } else {
                    alert(result.message || 'Error al guardar');
                }
            } catch (err) {
                alert('Error de conexión con el servidor');
            }
        }

        async function eliminarAlumno(cedula) {
            if (!confirm(`¿Está seguro de eliminar al alumno con cédula ${cedula}?`)) return;

            try {
                const res = await fetch(`/api/alumnos/${cedula}`, {
                    method: 'DELETE'
                });
                const result = await res.json();
                if (result.success) {
                    await cargarAlumnos();
                } else {
                    alert(result.message || 'Error al eliminar');
                }
            } catch (err) {
                alert('Error de conexión con el servidor');
            }
        }

        function filtrarAlumnos() {
            const filtro = document.getElementById('busquedaCedula').value.toLowerCase();
            const filas = document.querySelectorAll('#tablaAlumnos tr');

            filas.forEach(fila => {
                const cedulaTexto = fila.cells[0] ? fila.cells[0].textContent.toLowerCase() : '';
                fila.style.display = cedulTexto.includes(filtro) ? '' : 'none';
            });
        }
    </script>
</body>

</html>
