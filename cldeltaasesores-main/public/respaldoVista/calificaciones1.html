<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Calificaciones - Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        .table-custom-header th {
            background-color: #cfe2ff !important;
            color: #000000 !important;
            font-size: 0.85rem !important;
            font-weight: 700 !important;
            text-align: center;
            vertical-align: middle;
        }
        
        .table-custom-header th:nth-child(2),
        .table-custom-header th:nth-child(3),
        .table-custom-header th:nth-child(4) {
            text-align: left;
        }
        
        .table-custom-body td {
            font-size: 0.85rem !important;
            vertical-align: middle;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/dashboard">
                <span>Asesores UNA</span>
            </a>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link text-white" href="/calificaciones"><i class="bi bi-award-fill me-1"></i> Calificaciones</a></li>
                </ul>
                <div class="d-flex align-items-center text-white ms-auto">
                    <span id="nombreUsuario" class="me-3 fw-semibold">Cargando...</span>
                    <button onclick="window.location.href='/'" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-end">
            <div class="col-sm-4">
                <h3 class="fw-bold text-primary mb-0"><i class="bi bi-award-fill me-2"></i>Módulo de Calificaciones</h3>
                <p id="nombreMateriaSeleccionada" class="text-muted fw-semibold mt-1 mb-0" style="font-size: 1.1rem; min-height: 27px;"></p>
            </div>
            <div class="col-sm-8 text-sm-end d-flex justify-content-sm-end align-items-end gap-3 mt-2 mt-sm-0">
                <div>
                    <label for="filtroSemestre" class="form-label fw-semibold text-start d-block mb-1" style="font-size: 0.85rem;">Semestre</label>
                    <select id="filtroSemestre" class="form-select w-auto border-success shadow-sm" style="border-width: 2px;"></select>
                </div>

                <div>
                    <label for="filtroCodigoMateria" class="form-label fw-semibold text-start d-block mb-1" style="font-size: 0.85rem;">Código materia</label>
                    <select id="filtroCodigoMateria" class="form-select w-auto border-success shadow-sm" style="border-width: 2px;" onchange="filtrarCalificacionesPorMateria()">
                        <option value="">Seleccione una materia</option>
                    </select>
                </div>

                <div>
                    <label class="form-label d-block mb-1" style="font-size: 0.85rem; visibility: hidden;">Acción</label>
                    <button class="btn btn-success text-nowrap shadow-sm" onclick="abrirModalRegistrarAlumno()"><i class="bi bi-plus-circle me-1"></i> Registrar Alumnos</button>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-custom-header" id="tablaCabecera">
                            <tr>
                                <th>Items</th>
                                <th class="text-start">Apellido y nombre</th>
                                <th class="text-start">Cédula</th>
                                <th>Calificación</th>
                                <th>Descripción</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCalificaciones" class="table-custom-body">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Seleccione una materia para ver los objetivos y calificaciones.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CARGAR / EDITAR CALIFICACIÓN (OBJETIVOS) -->
    <div class="modal fade" id="modalCalificacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formCalificacion" onsubmit="guardarCalificacionDinamica(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title"><i class="bi bi-cloud-arrow-up-fill me-2"></i>Cargar Notas de Objetivos</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="modalAlumnoId">

                        <div class="mb-3 p-3 bg-light rounded border">
                            <h6 id="modalNombreAlumno" class="fw-bold text-primary mb-1">Nombre y Apellido</h6>
                            <p id="modalCedulaAlumno" class="text-muted mb-0" style="font-size: 0.9rem;">Cédula: V-00000000</p>
                        </div>

                        <!-- Casillas de objetivos uno debajo del otro -->
                        <div id="contenedorObjetivosModal" class="mb-3">
                            <!-- Inyectado dinámicamente -->
                        </div>

                        <div class="mb-3">
                            <label for="modalCalificacionDefinitiva" class="form-label fw-semibold">Calificación Definitiva</label>
                            <input type="text" class="form-control bg-white fw-bold text-success" id="modalCalificacionDefinitiva" readonly placeholder="Se calcula automáticamente">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Calificaciones</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let modalCalificacionInstance = null;
        let listaMateriasGlobal = [];
        let listaAlumnosMateria = [];

        document.addEventListener("DOMContentLoaded", async() => {
            modalCalificacionInstance = new bootstrap.Modal(document.getElementById('modalCalificacion'));
            await cargarMaterias();
        });

        async function cargarMaterias() {
            try {
                const res = await fetch('/api/materias');
                const data = await res.json();
                const selectFiltro = document.getElementById('filtroCodigoMateria');
                selectFiltro.innerHTML = '<option value="">Seleccione una materia</option>';

                if (data.success && Array.isArray(data.data)) {
                    listaMateriasGlobal = data.data;
                    listaMateriasGlobal.forEach(m => {
                        selectFiltro.innerHTML += `<option value="${m.codigo}">${m.codigo} - ${m.descripcion || ''}</option>`;
                    });
                }
            } catch (error) {
                console.error("Error al cargar materias:", error);
            }
        }

        async function filtrarCalificacionesPorMateria() {
            const codigoSeleccionado = document.getElementById('filtroCodigoMateria').value;
            const labelNombreMateria = document.getElementById('nombreMateriaSeleccionada');
            const thead = document.getElementById('tablaCabecera');
            const tbody = document.getElementById('tablaCalificaciones');

            if (!codigoSeleccionado) {
                labelNombreMateria.textContent = '';
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">Seleccione una materia para ver los objetivos y calificaciones.</td></tr>`;
                return;
            }

            const materiaEncontrada = listaMateriasGlobal.find(m => m.codigo === codigoSeleccionado);
            labelNombreMateria.textContent = materiaEncontrada ? `Materia: ${materiaEncontrada.descripcion}` : '';

            try {
                const res = await fetch(`/api/calificaciones/${codigoSeleccionado}`);
                const resultado = await res.json();

                if (resultado.success) {
                    listaAlumnosMateria = resultado.data.alumnos || [];
                    const objetivosDef = resultado.data.objetivos || []; // Obtiene los pesos y estructura desde la tabla calificacion_[codigo]

                    let thObjetivosHtml = '';
                    objetivosDef.forEach(obj => {
                        thObjetivosHtml += `<th>Obj ${obj.nro}<br><span style="font-weight: normal;">(Peso: ${obj.peso})</span></th>`;
                    });

                    thead.innerHTML = `
                        <tr>
                            <th>Items</th>
                            <th class="text-start">Apellido y nombre</th>
                            <th class="text-start">Cédula</th>
                            ${thObjetivosHtml}
                            <th>Calificación</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    `;

                    if (listaAlumnosMateria.length > 0) {
                        tbody.innerHTML = '';
                        listaAlumnosMateria.forEach(item => {
                            let tdObjetivosHtml = '';
                            objetivosDef.forEach(obj => {
                                const valObj = item[`obj${obj.nro}`] !== undefined ? item[`obj${obj.nro}`] : 0;
                                tdObjetivosHtml += `<td class="text-center">${valObj}</td>`;
                            });

                            tbody.innerHTML += `
                                <tr>
                                    <td>${item.id}</td>
                                    <td class="text-start">${item.nombre_alumno || '-'}</td>
                                    <td class="text-start">${item.cedula_alumno || '-'}</td>
                                    ${tdObjetivosHtml}
                                    <td class="text-center fw-bold text-success">${item.calificacion_definitiva || 0}</td>
                                    <td class="text-center">
                                        <button class="btn btn-sm btn-outline-primary" onclick="editarCalificacion(${item.id})" title="Cargar / Editar Calificación">
                                            <i class="bi bi-cloud-arrow-up-fill"></i>
                                        </button>
                                    </td>
                                </tr>`;
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="${6 + objetivosDef.length}" class="text-center text-muted py-4">No hay registros en esta materia.</td></tr>`;
                    }
                }
            } catch (error) {
                console.error("Error al filtrar calificaciones:", error);
            }
        }

        // El código de la materia se toma directamente del combobox superior
        function editarCalificacion(alumnoId) {
            const codMateria = document.getElementById('filtroCodigoMateria').value;
            if (!codMateria) {
                Swal.fire('Atención', 'Debe seleccionar una materia en el combobox superior.', 'warning');
                return;
            }

            const alumno = listaAlumnosMateria.find(a => String(a.id) === String(alumnoId));
            if (!alumno) {
                Swal.fire('Error', 'No se encontró el alumno seleccionado.', 'error');
                return;
            }

            document.getElementById('modalAlumnoId').value = alumno.id;
            document.getElementById('modalNombreAlumno').textContent = alumno.nombre_alumno || 'Sin nombre';
            document.getElementById('modalCedulaAlumno').textContent = `Cédula: ${alumno.cedula_alumno || 'N/A'}`;

            const contenedorObjetivos = document.getElementById('contenedorObjetivosModal');
            contenedorObjetivos.innerHTML = '';

            // Petición para obtener los objetivos y pesos específicos de la tabla calificacion_[codigo]
            fetch(`/api/calificaciones/${codMateria}`)
                .then(res => res.json())
                .then(resultado => {
                    if (resultado.success) {
                        const objetivosDef = resultado.data.objetivos || [];

                        objetivosDef.forEach(obj => {
                            const valorActual = alumno[`obj${obj.nro}`] !== undefined ? alumno[`obj${obj.nro}`] : 0;

                            // Se restringe estrictamente a 0 o 1 mediante select
                            contenedorObjetivos.innerHTML += `
                                <div class="mb-2">
                                    <label class="form-label fw-semibold mb-1" style="font-size: 0.85rem;">Objetivo ${obj.nro} (Peso: ${obj.peso})</label>
                                    <select class="form-select form-select-sm input-objetivo" data-peso="${obj.peso}" data-nro="${obj.nro}" onchange="recalcularAcumulador()">
                                        <option value="0" ${valorActual == 0 ? 'selected' : ''}>0</option>
                                        <option value="1" ${valorActual == 1 ? 'selected' : ''}>1</option>
                                    </select>
                                </div>`;
                        });
                        recalcularAcumulador();
                        modalCalificacionInstance.show();
                    }
                });
        }

        // Multiplicación por el peso, guardado en acumulador y comparación con peso acumulado
        function recalcalcularAcumulador() {
            const selects = document.querySelectorAll('.input-objetivo');
            let acumulador = 0;

            selects.forEach(select => {
                const calObj = parseFloat(select.value) || 0; // Solo 0 o 1
                const pesoObj = parseFloat(select.getAttribute('data-peso')) || 0;

                // Multiplicación del objetivo por su peso definido
                acumulador += (calObj * pesoObj);
            });

            // Asignación de la calificación definitiva basada en la comparación del acumulador
            let calificacionDefinitiva = 0;
            if (acumulador >= 18) calificacionDefinitiva = 5;
            else if (acumulador >= 14) calificacionDefinitiva = 4;
            else if (acumulador >= 10) calificacionDefinitiva = 3;

            document.getElementById('modalCalificacionDefinitiva').value = `${acumulador} Ptos (Definitiva: ${calificacionDefinitiva})`;
        }

        async function guardarCalificacionDinamica(e) {
            e.preventDefault();
            const alumnoId = document.getElementById('modalAlumnoId').value;
            const codMateria = document.getElementById('filtroCodigoMateria').value;

            const selects = document.querySelectorAll('.input-objetivo');
            let objetivosData = {};
            let acumulador = 0;

            selects.forEach(select => {
                const nro = select.getAttribute('data-nro');
                const val = parseInt(select.value) || 0;
                const peso = parseFloat(select.getAttribute('data-peso')) || 0;

                objetivosData[`obj${nro}`] = val;
                acumulador += (val * peso);
            });

            const payload = {
                id: alumnoId,
                cod_materia: codMateria,
                objetivos: objetivosData,
                peso_acumulado: acumulador
            };

            try {
                const res = await fetch(`/api/calificaciones-alumnos/objetivos`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.success) {
                    modalCalificacionInstance.hide();
                    filtrarCalificacionesPorMateria();
                    Swal.fire({
                        icon: 'success',
                        title: 'Actualizado',
                        text: 'Notas guardadas correctamente.',
                        timer: 1500,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire('Error', result.message || 'No se pudo guardar.', 'error');
                }
            } catch (error) {
                console.error("Error al guardar:", error);
            }
        }
    </script>
</body>

</html>
