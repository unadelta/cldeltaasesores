<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Materias - Sistema UNA</title>
    <!-- Bootstrap CSS (Opcional, para que luzca ordenado y limpio) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4 text-center">Gestión de Materias (materia_una)</h2>

        <!-- Formulario para agregar / registrar materia -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">Registrar Nueva Materia</h5>
                <form id="formMateria">
                    <div class="mb-3">
                        <label for="codigo" class="form-label">Código de Materia</label>
                        <input type="text" class="form-control" id="codigo" required placeholder="Ej: 339, MAT-01">
                    </div>
                    <div class="mb-3">
                        <label for="descripcion" class="form-label">Descripción / Nombre</label>
                        <input type="text" class="form-control" id="descripcion" required placeholder="Ej: Matemática I">
                    </div>
                    <button type="submit" class="btn btn-primary">Guardar Materia</button>
                </form>
            </div>
        </div>

        <!-- Tabla para listar las materias -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-3">Listado de Materias Registradas</h5>
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Descripción</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-materias">
                            <!-- Los datos se cargarán dinámicamente aquí mediante JavaScript -->
                            <tr>
                                <td colspan="4" class="text-center text-muted">Cargando materias...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de lógica Frontend -->
    <script>
        // Función para cargar y pintar las materias desde el servidor Node.js
        async function cargarMaterias() {
            const tbody = document.getElementById('tabla-materias');
            try {
                const response = await fetch('/api/materiauna');
                const result = await response.json();

                // Verificamos que la respuesta sea exitosa y contenga un arreglo en .data
                if (result.success && Array.isArray(result.data)) {
                    tbody.innerHTML = ''; // Limpiar mensaje de carga

                    if (result.data.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="4" class="text-center text-warning">No hay materias registradas en la base de datos.</td></tr>`;
                        return;
                    }

                    // Recorremos cada materia y armamos las filas de la tabla
                    result.data.forEach(materia => {
                        tbody.innerHTML += `
                            <tr>
                                <td>${materia.id}</td>
                                <td>${materia.codigo}</td>
                                <td>${materia.descripcion}</td>
                                <td>
                                    <button class="btn btn-sm btn-warning" onclick="editarMateria(${materia.id})">Editar</button>
                                    <button class="btn btn-sm btn-danger" onclick="eliminarMateria(${materia.id})">Eliminar</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error al obtener los datos del servidor.</td></tr>`;
                }
            } catch (error) {
                console.error("Error en la petición:", error);
                tbody.innerHTML = `<tr><td colspan="4" class="text-center text-danger">No se pudo conectar con el servidor.</td></tr>`;
            }
        }

        // Manejo del formulario para enviar una nueva materia por POST (asegúrate de tener tu ruta POST /api/materiauna en el servidor)
        document.getElementById('formMateria').addEventListener('submit', async function(e) {
            e.preventDefault();

            const codigo = document.getElementById('codigo').value;
            const descripcion = document.getElementById('descripcion').value;

            try {
                const res = await fetch('/api/materiauna', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        codigo,
                        descripcion
                    })
                });
                const data = await res.json();

                if (data.success) {
                    alert('¡Materia registrada con éxito!');
                    document.getElementById('formMateria').reset();
                    cargarMaterias(); // Recargar la tabla automáticamente
                } else {
                    alert('Error al registrar: ' + (data.message || 'Intente nuevamente'));
                }
            } catch (err) {
                console.error("Error al guardar:", err);
                alert('Ocurrió un error al intentar guardar la materia.');
            }
        });

        // Funciones auxiliares de ejemplo para acciones futuras
        function editarMateria(id) {
            alert('Función de editar materia ID: ' + id);
        }

        async function eliminarMateria(id) {
            if (confirm('¿Estás seguro de que deseas eliminar esta materia?')) {
                // Aquí puedes agregar tu petición DELETE hacia /api/materiauna/:id si la tienes implementada
                alert('Eliminando materia ID: ' + id);
            }
        }

        // Cargar las materias al abrir la página por primera vez
        document.addEventListener('DOMContentLoaded', cargarMaterias);
    </script>
</body>

</html>
