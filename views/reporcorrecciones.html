<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Control de Correcciones - UNA Delta Amacuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Configuración base de la página física */
        
        @page {
            size: letter landscape;
            margin: 5mm;
        }
        
        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        
        body.orientacion-vertical @page {
            size: letter portrait;
            margin: 5mm;
        }
        /* Contenedor que simula la hoja física en pantalla (Horizontal por defecto) */
        
        .page-container {
            background: white;
            width: 269mm;
            height: 205mm;
            max-height: 205mm;
            margin: 15px auto;
            padding: 4mm 6mm;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            page-break-after: always;
            page-break-inside: avoid;
            overflow: hidden;
        }
        
        body.orientacion-vertical .page-container {
            width: 205mm !important;
            height: 269mm !important;
            max-height: 269mm !important;
        }
        /* Ocultar barra de acciones y forzar altura exacta al imprimir */
        
        @media print {
            body {
                background-color: white;
            }
            .no-print {
                display: none !important;
            }
            .page-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 3mm 5mm !important;
                width: 100% !important;
                height: 202mm !important;
                max-height: 202mm !important;
                page-break-after: always;
                page-break-inside: avoid;
                overflow: hidden;
            }
            body.orientacion-vertical .page-container {
                height: 266mm !important;
                max-height: 266mm !important;
            }
        }
        /* Encabezado compacto */
        
        .header-container {
            border-bottom: 2px solid #0d6efd;
            padding-bottom: 2px;
            margin-bottom: 4px;
        }
        
        .logo-una {
            max-height: 30px;
            object-fit: contain;
        }
        
        .institution-title h4 {
            margin: 0;
            font-weight: bold;
            color: #0d6efd;
            font-size: 0.8rem;
        }
        
        .institution-title h5 {
            margin: 1px 0 0 0;
            color: #495057;
            font-size: 0.68rem;
            font-weight: 600;
        }
        
        .table-content-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }
        /* Estilo de la tabla ultra-compacto */
        
        .table-report {
            font-size: 0.62rem;
            width: 100%;
            margin-bottom: 0;
        }
        
        .table-report th {
            background-color: #0d6efd !important;
            color: white;
            text-align: center;
            padding: 2px 3px;
            font-weight: 600;
            font-size: 0.63rem;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .table-report td {
            padding: 2px 3px;
            vertical-align: middle;
            border-color: #dee2e6;
            line-height: 1;
        }
        
        .table-report tbody tr:nth-child(odd) {
            background-color: #fdfdfd;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        
        .table-report tbody tr:nth-child(even) {
            background-color: #f1f4f9;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }
        /* Pie de página con flexibilidad para anclarse exactamente al fondo de la hoja */
        
        .report-footer {
            margin-top: auto;
            padding-top: 4px;
            border-top: 1px solid #ced4da;
            font-size: 0.55rem;
        }
        
        .signature-line {
            border-top: 1px solid #333;
            width: 85%;
            margin: 8px auto 1px auto;
        }
    </style>
</head>

<body class="orientacion-horizontal">

    <!-- BARRA DE ACCIONES Y FILTRO DE FECHAS (No se imprime) -->
    <div class="container my-3 no-print">
        <div class="card shadow-sm border-0 p-3 bg-white">
            <div class="row align-items-end g-3">
                <div class="col-md-2">
                    <a href="/dashboard" class="btn btn-outline-secondary btn-sm w-100"><i class="bi bi-arrow-left me-1"></i> Dashboard</a>
                </div>
                <div class="col-md-2">
                    <label for="fechaDesde" class="form-label small fw-semibold mb-1">Fecha Desde:</label>
                    <input type="date" id="fechaDesde" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label for="fechaHasta" class="form-label small fw-semibold mb-1">Fecha Hasta:</label>
                    <input type="date" id="fechaHasta" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label for="selectOrientacion" class="form-label small fw-semibold mb-1">Orientación de Impresión:</label>
                    <select id="selectOrientacion" class="form-select form-select-sm" onchange="cambiarOrientacion(this.value)">
                        <option value="horizontal" selected>Horizontal (Landscape)</option>
                        <option value="vertical">Vertical (Portrait)</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button onclick="cargarReporteConFiltro()" class="btn btn-primary btn-sm w-100"><i class="bi bi-filter me-1"></i> Generar</button>
                    <button onclick="window.print()" class="btn btn-success btn-sm" title="Imprimir"><i class="bi bi-printer-fill"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR DINÁMICO DE PÁGINAS -->
    <div id="contenedorPaginas">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Cargando registros por defecto...</p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let nombreAsesorActual = "Asesor";
        let listaDatosGlobal = [];

        document.addEventListener("DOMContentLoaded", async() => {
            await cargarSesionYDatos();
        });

        async function cargarSesionYDatos() {
            try {
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated && dataUser.user) {
                    nombreAsesorActual = dataUser.user.nombre || "Asesor";
                }
            } catch (err) {
                console.error("Error al obtener sesión:", err);
            }

            await cargarReporteConFiltro();
        }

        async function cargarReporteConFiltro() {
            const desde = document.getElementById('fechaDesde').value;
            const hasta = document.getElementById('fechaHasta').value;

            let url = '/api/reporcorrecciones';

            if (desde && hasta) {
                url += `?fecha_desde=${desde}&fecha_hasta=${hasta}`;
            }

            const contenedor = document.getElementById('contenedorPaginas');
            contenedor.innerHTML = `<div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div><p class="text-muted mt-2">Cargando datos...</p></div>`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                listaDatosGlobal = data.success ? data.data : (Array.isArray(data) ? data : []);
                generarPaginasReporte(listaDatosGlobal);

            } catch (err) {
                console.error("Error al cargar reporte:", err);
                contenedor.innerHTML = `<div class="alert alert-danger text-center m-4">Error al conectar con el servidor para generar el reporte.</div>`;
            }
        }

        function cambiarOrientacion(tipo) {
            const body = document.body;
            if (tipo === 'vertical') {
                body.className = 'orientacion-vertical';
            } else {
                body.className = 'orientacion-horizontal';
            }
            if (listaDatosGlobal.length > 0) {
                generarPaginasReporte(listaDatosGlobal);
            }
        }

        function generarPaginasReporte(datos) {
            const contenedor = document.getElementById('contenedorPaginas');
            contenedor.innerHTML = '';

            if (datos.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-muted py-5 bg-white shadow-sm m-4 rounded">No se encontraron registros de correcciones para este asesor.</div>`;
                return;
            }

            const esVertical = document.body.classList.contains('orientacion-vertical');
            const itemsPorPagina = esVertical ? 13 : 18;
            const totalPaginas = Math.ceil(datos.length / itemsPorPagina);

            for (let i = 0; i < totalPaginas; i++) {
                const inicio = i * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const chunk = datos.slice(inicio, fin);

                let filasHTML = '';
                chunk.forEach((item, index) => {
                    const numeroConsecutivo = inicio + index + 1;

                    let fechaFormateada = item.fecha || 'N/D';
                    if (fechaFormateada.includes('T')) {
                        fechaFormateada = fechaFormateada.replace('T', ' ').substring(0, 19);
                    }

                    filasHTML += `
                        <tr>
                            <td class="text-center fw-semibold">${numeroConsecutivo}</td>
                            <td class="text-center">${item.cedula_alumno || ''}</td>
                            <td>${item.nombre_alumno || ''}</td>
                            <td class="text-center"><span class="badge bg-light text-dark border" style="font-size: 0.58rem;">${item.codigo_carrera || ''}</span></td>
                            <td class="text-center"><span class="badge bg-secondary" style="font-size: 0.58rem;">${item.codigo_materia || ''}</span></td>
                            <td class="text-center">${item.tipo_correccion || ''}</td>
                            <td class="text-center">${fechaFormateada}</td>
                        </tr>
                    `;
                });

                const paginaDiv = document.createElement('div');
                paginaDiv.className = 'page-container';
                paginaDiv.innerHTML = `
                    <div class="table-content-area">
                        <!-- ENCABEZADO INSTITUCIONAL INTEGRADO EN CADA HOJA -->
                        <div class="row align-items-center header-container">
                            <div class="col-8 d-flex align-items-center">
                                <img src="/jpg/logouna.jpg" alt="Logo UNA" class="logo-una me-3" onerror="this.style.display='none'">
                                <div class="institution-title">
                                    <h4>Universidad Nacional Abierta</h4>
                                    <h5>Centro Local Delta Amacuro</h5>
                                </div>
                            </div>
                            <div class="col-4 text-end">
                                <span class="text-primary fw-bold" style="font-size: 0.68rem;">CONTROL DE CORRECCIONES</span>
                                <div class="text-muted" style="font-size: 0.52rem;">Emitido: ${new Date().toLocaleDateString()}</div>
                            </div>
                        </div>

                        <!-- TABLA DE DATOS CON SECUENCIA NUMÉRICA -->
                        <div class="table-responsive">
                            <table class="table table-bordered table-report align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 6%;">N°</th>
                                        <th style="width: 14%;">Cédula</th>
                                        <th style="width: 25%;">Nombre del Alumno</th>
                                        <th style="width: 10%;">Carrera</th>
                                        <th style="width: 10%;">Materia</th>
                                        <th style="width: 17%;">Tipo Corrección</th>
                                        <th style="width: 18%;">Fecha</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- PIE DE PÁGINA CON FIRMAS FIJO AL FINAL DE LA HOJA -->
                    <div class="report-footer">
                        <div class="row align-items-end text-center">
                            <!-- 1. Firma Asesor de la sesión -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold text-truncate" style="font-size: 0.55rem;">${nombreAsesorActual}</div>
                                <div class="text-muted" style="font-size: 0.48rem;">Asesor</div>
                            </div>

                            <!-- 2. Firma Dra. Yovinsa Salazar -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold" style="font-size: 0.55rem;">Dra. Yovinsa Salazar</div>
                                <div class="text-muted" style="font-size: 0.48rem;">Jefa de la Unidad Académica</div>
                            </div>

                            <!-- 3. Firma Dr. Edgar Ramírez -->
                            <div class="col-3">
                                <div class="signature-line"></div>
                                <div class="fw-bold" style="font-size: 0.55rem;">Dr. Edgar Ramírez</div>
                                <div class="text-muted" style="font-size: 0.48rem;">Coordinador del centro local Delta Amacuro</div>
                            </div>

                            <!-- 4. Número de Página Dinámico -->
                            <div class="col-3">
                                <div class="signature-line" style="visibility: hidden;"></div>
                                <div class="fw-bold text-dark" style="font-size: 0.55rem;">Página ${i + 1} de ${totalPaginas}</div>
                                <div class="text-muted" style="font-size: 0.48rem; visibility: hidden;">Paginación</div>
                            </div>
                        </div>
                    </div>
                `;

                contenedor.appendChild(paginaDiv);
            }
        }
    </script>
</body>

</html>
