<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carreras - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Estilos personalizados para las ventanas emergentes (Toasts / Modales) */
        
        .modal-notificacion .modal-content {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }
        
        .icon-box {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
        }
        
        .icon-box.success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }
        
        .icon-box.danger {
            background-color: #ffebee;
            color: #c62828;
        }
        
        .icon-box.warning {
            background-color: #fff8e1;
            color: #f57f17;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-mortarboard me-2"></i>Módulo de Carreras</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success rounded-pill px-3 shadow-sm" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Carrera
                </button>
            </div>
        </div>

        <!-- TABLA DE CARRERAS -->
        <div class="card border-0 shadow-sm rounded-3">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Nombre de Carrera</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCarreras">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA CREAR / EDITAR CARRERA -->
    <div class="modal fade" id="modalCarrera" tabindex="-1" aria-labelledby="modalCarreraLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <form id="formCarrera" onsubmit="guardarCarrera(event)">
                    <div class="modal-header bg-primary text-white border-0">
                        <h5 class="modal-title fw-bold" id="modalCarreraLabel">Registrar Carrera</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="carreraId">

                        <div class="mb-3">
                            <label for="codigo" class="form-label fw-semibold">Código de Carrera</label>
                            <input type="text" class="form-control" id="codigo" required autocomplete="off" placeholder="Ej: 236">
                        </div>

                        <div class="mb-3">
                            <label for="nombre_carrera" class="form-label fw-semibold">Nombre de Carrera</label>
                            <input type="text" class="form-control" id="nombre_carrera" required autocomplete="off" placeholder="Ej: Ingeniería de Sistemas">
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4" id="btnGuardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL ELEGANTE DE NOTIFICACIÓN / MENSAJE EMERGENTE -->
    <div class="modal fade modal-notificacion" id="modalNotificacion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-3">
                <div class="modal-body">
                    <div id="notifIconoBox" class="icon-box success">
                        <i id="notifIcono" class="bi bi-check-lg"></i>
                    </div>
                    <h5 id="notifTitulo" class="fw-bold mb-2">¡Éxito!</h5>
                    <p id="notifMensaje" class="text-muted mb-3 fs-6">Operación realizada con éxito.</p>
                    <button type="button" class="btn btn-primary rounded-pill px-4 w-100" data-bs-dismiss="modal">Aceptar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIRMACIÓN DE ELIMINACIÓN -->
    <div class="modal fade modal-notificacion" id="modalConfirmarEliminar" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-3">
                <div class="modal-body">
                    <div class="icon-box warning">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <h5 class="fw-bold mb-2">¿Eliminar carrera?</h5>
                    <p class="text-muted mb-4 fs-6">Esta acción no se puede deshacer.</p>
                    <div class="d-flex justify-content-center gap-2">
                        <button type="button" class="btn btn-light rounded-pill px-3 w-50" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-danger rounded-pill px-3 w-50" id="btnConfirmarEliminar">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalCarreraInstance = null;
        let modalNotifInstance = null;
        let modalConfirmEliminarInstance = null;
        let idCarreraAEliminar = null;

        // 1. Inicialización principal
        document.addEventListener("DOMContentLoaded", async() => {
            modalCarreraInstance = new bootstrap.Modal(document.getElementById('modalCarrera'));
            modalNotifInstance = new bootstrap.Modal(document.getElementById('modalNotificacion'));
            modalConfirmEliminarInstance = new bootstrap.Modal(document.getElementById('modalConfirmarEliminar'));

            await verificarSesionYCargar();

            // Evento para el botón de confirmación de eliminación
            document.getElementById('btnConfirmarEliminar').addEventListener('click', async() => {
                modalConfirmEliminarInstance.hide();
                if (idCarreraAEliminar) {
                    await procesarEliminacion(idCarreraAEliminar);
                }
            });
        });

        async function verificarSesionYCargar() {
            try {
                const res = await fetch('/api/user-session');
                const data = await res.json();

                if (data.authenticated) {
                    const spanUsuario = document.getElementById('nombreUsuario');
                    if (spanUsuario) {
                        spanUsuario.textContent = data.user.nombre || data.user.usuario;
                    }
                    await cargarCarreras();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error al verificar sesión", err);
            }
        }

        async function cargarCarreras() {
            try {
                const res = await fetch('/api/carreras');
                const data = await res.json();
                const tbody = document.getElementById('tablaCarreras');
                tbody.innerHTML = '';

                const listaCarreras = Array.isArray(data) ? data : (data.data || []);

                if (listaCarreras.length > 0) {
                    listaCarreras.forEach(carrera => {
                        const nombreEscapado = carrera.nombre_carrera ? carrera.nombre_carrera.replace(/'/g, "\\'") : '';
                        tbody.innerHTML += `
                            <tr>
                                <td>${carrera.id}</td>
                                <td><span class="badge bg-secondary">${carrera.codigo}</span></td>
                                <td class="fw-semibold text-secondary">${carrera.nombre_carrera}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary rounded-circle me-1" onclick="abrirModalEditar(${carrera.id}, '${carrera.codigo}', '${nombreEscapado}')" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger rounded-circle" onclick="confirmarEliminar(${carrera.id})" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No hay carreras registradas.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar carreras", err);
                document.getElementById('tablaCarreras').innerHTML = `<tr><td colspan="4" class="text-center text-danger py-4">Error al obtener los datos.</td></tr>`;
            }
        }

        function abrirModalCrear() {
            document.getElementById('formCarrera').reset();
            document.getElementById('carreraId').value = '';
            document.getElementById('modalCarreraLabel').textContent = 'Registrar Carrera';
            modalCarreraInstance.show();
        }

        function abrirModalEditar(id, codigo, nombre_carrera) {
            document.getElementById('formCarrera').reset();
            document.getElementById('carreraId').value = id;
            document.getElementById('codigo').value = codigo;
            document.getElementById('nombre_carrera').value = nombre_carrera;
            document.getElementById('modalCarreraLabel').textContent = 'Editar Carrera';
            modalCarreraInstance.show();
        }

        async function guardarCarrera(e) {
            e.preventDefault();
            const id = document.getElementById('carreraId').value;
            const codigo = document.getElementById('codigo').value.trim();
            const nombre_carrera = document.getElementById('nombre_carrera').value.trim();

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/carreras/${id}` : '/api/carreras';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        codigo,
                        nombre_carrera
                    })
                });

                const data = await res.json();

                if (res.ok && (data.success !== false)) {
                    modalCarreraInstance.hide();
                    const titulo = id ? '¡Carrera Modificada!' : '¡Carrera Creada!';
                    const msj = id ?
                        'Los cambios en la carrera se han guardado exitosamente.' :
                        'La nueva carrera ha sido registrada en el sistema.';

                    mostrarEmergente(titulo, data.message || msj, 'success');
                    await cargarCarreras();
                } else {
                    let titulo = 'Atención';
                    let mensajeError = data.message || 'No se pudo procesar la solicitud.';

                    if (res.status === 400 || res.status === 409 || (data.message && data.message.toLowerCase().includes('duplicate'))) {
                        titulo = 'Código Duplicado';
                        mensajeError = `El código de carrera "${codigo}" ya existe en el sistema. Introduce uno diferente.`;
                    }
                    mostrarEmergente(titulo, mensajeError, 'danger');
                }
            } catch (err) {
                console.error("Error en la petición:", err);
                mostrarEmergente('Error de Conexión', 'No se pudo conectar con el servidor.', 'danger');
            }
        }

        function confirmarEliminar(id) {
            idCarreraAEliminar = id;
            modalConfirmEliminarInstance.show();
        }

        async function procesarEliminacion(id) {
            try {
                const res = await fetch(`/api/carreras/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (res.ok && (data.success !== false)) {
                    mostrarEmergente('¡Carrera Eliminada!', data.message || 'La carrera se ha eliminado exitosamente.', 'success');
                    await cargarCarreras();
                } else {
                    mostrarEmergente('Error al Eliminar', data.message || 'No se pudo eliminar la carrera.', 'danger');
                }
            } catch (err) {
                console.error("Error al eliminar:", err);
                mostrarEmergente('Error de Conexión', 'No se pudo conectar con el servidor.', 'danger');
            } finally {
                idCarreraAEliminar = null;
            }
        }

        // Función centralizada para desplegar la ventana emergente elegante
        function mostrarEmergente(titulo, mensaje, tipo = 'success') {
            const iconoBox = document.getElementById('notifIconoBox');
            const icono = document.getElementById('notifIcono');

            iconoBox.className = `icon-box ${tipo}`;
            if (tipo === 'success') {
                icono.className = 'bi bi-check-lg';
            } else if (tipo === 'danger') {
                icono.className = 'bi bi-x-lg';
            } else {
                icono.className = 'bi bi-exclamation-lg';
            }

            document.getElementById('notifTitulo').textContent = titulo;
            document.getElementById('notifMensaje').textContent = mensaje;

            modalNotifInstance.show();
        }

        function cerrarSesion() {
            window.location.href = '/';
        }

        // 2. Script para cargar el HTML del Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario en el navbar:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });
    </script>
</body>

</html>
