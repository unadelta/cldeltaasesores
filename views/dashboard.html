<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Estilos base para pantalla completa y fondo */
        
        body {
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/jpg/fachadaUna.jpg') no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Área principal de contenido para empujar la tarjeta hacia abajo dinámicamente */
        
        .main-content {
            flex: 1;
            display: flex;
            align-items: flex-end;
        }
        /* Tarjeta de bienvenida responsiva con efecto glassmorphism */
        
        .card-welcome {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        /* Ajuste responsivo del fondo para móviles (evita congelamientos de background-attachment: fixed) */
        
        @media (max-width: 768px) {
            body {
                background-attachment: scroll;
            }
        }
    </style>
</head>

<body>

    <div id="navbar-container"></div>

    <main class="main-content py-4 py-md-5">
        <div class="container">
            <div class="row justify-content-center justify-content-md-end">
                <div class="col-12 col-sm-10 col-md-8 col-lg-6">
                    <div class="card border-0 shadow-lg p-3 p-sm-4 p-md-5 rounded-4 card-welcome">
                        <h3 class="fw-bold text-primary mb-2 fs-4 fs-md-3">Bienvenido al Panel de Control</h3>
                        <p class="text-secondary fs-6 mb-0">Seleccione una opción del menú superior para gestionar los registros del sistema.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Función general para cerrar sesión
        function cerrarSesion() {
            window.location.href = '/';
        }

        // Cargar Navbar y Validar Sesión en una sola ejecución optimizada
        document.addEventListener("DOMContentLoaded", async() => {
            try {
                // 1. Cargar el HTML del Navbar
                const navResponse = await fetch('/views/navbar.html');
                if (navResponse.ok) {
                    const navHtml = await navResponse.text();
                    document.getElementById('navbar-container').innerHTML = navHtml;
                }

                // 2. Verificar la sesión del usuario
                const sessionResponse = await fetch('/api/user-session');
                const sessionData = await sessionResponse.json();

                if (sessionData.authenticated && sessionData.user) {
                    const spanUsuario = document.getElementById('nombreUsuario');
                    if (spanUsuario) {
                        spanUsuario.textContent = sessionData.user.nombre || sessionData.user.usuario;
                    }
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error al inicializar el dashboard:", err);
            }
        });
    </script>
</body>

</html>
