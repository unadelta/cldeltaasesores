<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>
    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-mortarboard-fill me-2"></i>Módulo de Alumnos</h3>
            </div>
            <div class="col-sm-6 text-sm-end">
                <button class="btn btn-success" onclick="abrirModalAlumno()"><i class="bi bi-plus-circle me-1"></i> Registrar Nuevo Alumno</button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Cédula</th>
                                <th>Nombre y Apellido</th>
                                <th>Código de Carrera</th>
                                <th>Descripción</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaAlumnos">
                            <tr>
                                <td colspan="6" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRAR / EDITAR ALUMNO -->
    <div class="modal fade" id="modalAlumno" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formAlumno" onsubmit="guardarAlumno(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitulo">Registrar Nuevo Alumno</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="alumnoId">

                        <!-- Cédula -->
                        <div class="mb-3">
                            <label for="cedula" class="form-label fw-semibold">Cédula</label>
                            <div class="input-group">
                                <select class="form-select" id="nacionalidad" style="max-width: 80px;">
                                    <option value="V">V</option>
                                    <option value="E">E</option>
                                </select>
                                <span class="input-group-text">-</span>
                                <input type="text" class="form-control" id="cedula" placeholder="Ej: 12345678" required autocomplete="off">
                            </div>
                        </div>

                        <!-- Nombre y Apellido -->
                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre y Apellido</label>
                            <input type="text" class="form-control" id="nombre" placeholder="Ingrese nombre completo" required autocomplete="off">
                        </div>

                        <!-- Combobox Código de Carrera -->
                        <div class="mb-3">
                            <label for="selectCarrera" class="form-label fw-semibold">Carrera</label>
                            <select id="selectCarrera" class="form-select" required>
                                <option value="">Seleccione una carrera...</option>
                            </select>
                            <div class="form-text">Se guardará el código y su descripción correspondiente[cite: 1].</div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar Alumno</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let modalInstance = null;
        let listaAlumnosGlobal = [];
        let listaCarrerasGlobal = [];

        document.addEventListener("DOMContentLoaded", async() => {
            modalInstance = new bootstrap.Modal(document.getElementById('modalAlumno'));
            await verificarSesion();
            await cargarCarreras();
            await cargarAlumnos();
        });

        async function verificarSesion() {
            try {
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated) {
                    document.getElementById('nombreUsuario').textContent = dataUser.user.nombre;
                } else {
                    window.location.href = '/';
                }
            } catch (e) {
                console.error("Error al verificar sesión", e);
            }
        }

        async function cargarCarreras() {
            try {
                const res = await fetch('/api/carreras');
                const data = await res.json();
                const select = document.getElementById('selectCarrera');
                select.innerHTML = '<option value="">Seleccione una carrera...</option>';

                const lista = data.success ? data.data : data;
                if (Array.isArray(lista)) {
                    listaCarrerasGlobal = lista; // Guardamos en memoria para extraer la descripción fácilmente
                    lista.forEach(c => {
                        const codigo = c.codigo;
                        const descripcion = c.nombre_carrera || '';
                        select.innerHTML += `<option value="${codigo}">${codigo} - ${descripcion}</option>`;
                    });
                }
            } catch (error) {
                console.error("Error al cargar carreras:", error);
            }
        }

        async function cargarAlumnos() {
            try {
                const res = await fetch('/api/alumnos');
                const data = await res.json();
                const tbody = document.getElementById('tablaAlumnos');
                tbody.innerHTML = '';

                const lista = data.success ? data.data : data;
                listaAlumnosGlobal = Array.isArray(lista) ? lista : [];

                if (listaAlumnosGlobal.length > 0) {
                    listaAlumnosGlobal.forEach(a => {
                        const descripcionCarrera = a.descripcion_carrera || 'N/A';
                        tbody.innerHTML += `
                            <tr>
                                <td>${a.id}</td>
                                <td>${a.cedula}</td>
                                <td>${a.nombre}</td>
                                <td><span class="badge bg-secondary">${a.codigo_carrera}</span></td>
                                <td>${descripcionCarrera}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-warning me-1" onclick="editarAlumno(${a.id})" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="eliminarAlumno(${a.id})" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-muted py-4">No hay alumnos registrados.</td></tr>`;
                }
            } catch (error) {
                console.error("Error al cargar alumnos:", error);
            }
        }

        function abrirModalAlumno() {
            document.getElementById('formAlumno').reset();
            document.getElementById('alumnoId').value = '';
            document.getElementById('nacionalidad').value = 'V';
            document.getElementById('modalTitulo').textContent = 'Registrar Nuevo Alumno';
            document.getElementById('btnGuardar').textContent = 'Guardar Alumno';
            modalInstance.show();
        }

        function editarAlumno(id) {
            const alumno = listaAlumnosGlobal.find(a => a.id === id);
            if (!alumno) return;

            document.getElementById('alumnoId').value = alumno.id;

            if (alumno.cedula && alumno.cedula.includes('-')) {
                const partes = alumno.cedula.split('-');
                document.getElementById('nacionalidad').value = partes[0];
                document.getElementById('cedula').value = partes[1];
            } else {
                document.getElementById('nacionalidad').value = 'V';
                document.getElementById('cedula').value = alumno.cedula || '';
            }

            document.getElementById('nombre').value = alumno.nombre || '';
            document.getElementById('selectCarrera').value = alumno.codigo_carrera || '';

            document.getElementById('modalTitulo').textContent = 'Editar Alumno';
            document.getElementById('btnGuardar').textContent = 'Actualizar Alumno';

            modalInstance.show();
        }

        async function guardarAlumno(e) {
            e.preventDefault();

            const id = document.getElementById('alumnoId').value;
            const nac = document.getElementById('nacionalidad').value;
            const numCedula = document.getElementById('cedula').value.trim();
            const cedulaCompleta = `${nac}-${numCedula}`;

            const cedulaDuplicada = listaAlumnosGlobal.some(a => a.cedula === cedulaCompleta && (!id || a.id != id));
            if (cedulaDuplicada) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Cédula Repetida',
                    text: `El número de cédula ${cedulaCompleta} ya se encuentra registrado en el sistema.`,
                    confirmButtonColor: '#3085d6'
                });
                return;
            }

            // Obtenemos el código de la carrera seleccionada
            const codigoCarrera = document.getElementById('selectCarrera').value;

            // Buscamos la descripción correspondiente en la lista de carreras para enviarla al backend
            let descripcionCarrera = '';
            const carreraEncontrada = listaCarrerasGlobal.find(c => c.codigo === codigoCarrera);
            if (carreraEncontrada) {
                descripcionCarrera = carreraEncontrada.nombre_carrera || '';
            }

            const data = {
                cedula: cedulaCompleta,
                nombre: document.getElementById('nombre').value.trim(),
                codigo_carrera: codigoCarrera,
                descripcion_carrera: descripcionCarrera // <-- Enviamos la descripción para que se guarde en la BD
            };

            const url = id ? `/api/alumnos/${id}` : '/api/alumnos';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    modalInstance.hide();
                    await cargarAlumnos();

                    Swal.fire({
                        icon: 'success',
                        title: '¡Éxito!',
                        text: 'Alumno creado o actualizado con éxito',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    if (result.message && result.message.toLowerCase().includes('cedula')) {
                        Swal.fire({
                            icon: 'warning',
                            title: 'Cédula Repetida',
                            text: result.message,
                            confirmButtonColor: '#3085d6'
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: 'Error',
                            text: result.message || 'Error al procesar la solicitud.',
                            confirmButtonColor: '#d33'
                        });
                    }
                }
            } catch (error) {
                console.error("Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de Conexión',
                    text: 'No se pudo conectar con el servidor.',
                    confirmButtonColor: '#d33'
                });
            }
        }

        async function eliminarAlumno(id) {
            Swal.fire({
                title: '¿Está seguro?',
                text: "¿Está seguro de eliminar este alumno?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async(result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await fetch(`/api/alumnos/${id}`, {
                            method: 'DELETE'
                        });
                        const dataRes = await res.json();
                        if (dataRes.success) {
                            await cargarAlumnos();
                            Swal.fire(
                                'Eliminado',
                                'El alumno ha sido eliminado correctamente.',
                                'success'
                            );
                        } else {
                            Swal.fire(
                                'Error',
                                dataRes.message || 'No se pudo eliminar el alumno.',
                                'error'
                            );
                        }
                    } catch (error) {
                        console.error("Error:", error);
                        Swal.fire('Error', 'Error de conexión con el servidor.', 'error');
                    }
                }
            });
        }

        // Cargar el HTML del Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // Consultar y pintar el nombre del usuario en sesión después de cargar el menú
                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });
    </script>
</body>

</html>
