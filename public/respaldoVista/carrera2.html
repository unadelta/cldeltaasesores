<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Carreras - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-mortarboard me-2"></i>Módulo de Carreras</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Carrera
                </button>
            </div>
        </div>

        <!-- ALERTA DINÁMICA -->
        <div id="alertaCarrera" class="alert d-none" role="alert"></div>

        <!-- TABLA DE CARRERAS -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>ID</th>
                                <th>Código</th>
                                <th>Nombre de Carrera</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCarreras">
                            <tr>
                                <td colspan="4" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL PARA CREAR / EDITAR CARRERA -->
    <div class="modal fade" id="modalCarrera" tabindex="-1" aria-labelledby="modalCarreraLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formCarrera" onsubmit="guardarCarrera(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalCarreraLabel">Registrar Carrera</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="carreraId">

                        <div class="mb-3">
                            <label for="codigo" class="form-label fw-semibold">Código de Carrera</label>
                            <input type="text" class="form-control" id="codigo" required autocomplete="off">
                        </div>

                        <div class="mb-3">
                            <label for="nombre_carrera" class="form-label fw-semibold">Nombre de Carrera</label>
                            <input type="text" class="form-control" id="nombre_carrera" required autocomplete="off">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let modalCarreraInstance = null;

        document.addEventListener("DOMContentLoaded", async() => {
            modalCarreraInstance = new bootstrap.Modal(document.getElementById('modalCarrera'));
            await verificarSesionYCargar();
        });

        async function verificarSesionYCargar() {
            try {
                const res = await fetch('/api/user-session');
                const data = await res.json();

                if (data.authenticated) {
                    document.getElementById('nombreUsuario').textContent = data.user.nombre;
                    await cargarCarreras();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error al verificar sesión", err);
            }
        }

        async function cargarCarreras() {
            try {
                const res = await fetch('/api/carreras');
                const data = await res.json();
                const tbody = document.getElementById('tablaCarreras');
                tbody.innerHTML = '';

                if (data.success && data.data.length > 0) {
                    data.data.forEach(carrera => {
                        const nombreEscapado = carrera.nombre_carrera.replace(/'/g, "\\'");
                        tbody.innerHTML += `
                            <tr>
                                <td>${carrera.id}</td>
                                <td>${carrera.codigo}</td>
                                <td>${carrera.nombre_carrera}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar(${carrera.id}, '${carrera.codigo}', '${nombreEscapado}')" title="Editar">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarCarrera(${carrera.id})" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">No hay carreras registradas.</td></tr>`;
                }
            } catch (err) {
                console.error("Error al cargar carreras", err);
            }
        }

        function abrirModalCrear() {
            document.getElementById('formCarrera').reset();
            document.getElementById('carreraId').value = '';
            document.getElementById('modalCarreraLabel').textContent = 'Registrar Carrera';
            modalCarreraInstance.show();
        }

        function abrirModalEditar(id, codigo, nombre_carrera) {
            document.getElementById('formCarrera').reset();
            document.getElementById('carreraId').value = id;
            document.getElementById('codigo').value = codigo;
            document.getElementById('nombre_carrera').value = nombre_carrera;
            document.getElementById('modalCarreraLabel').textContent = 'Editar Carrera';
            modalCarreraInstance.show();
        }

        async function guardarCarrera(e) {
            e.preventDefault();
            const id = document.getElementById('carreraId').value;
            const codigo = document.getElementById('codigo').value.trim();
            const nombre_carrera = document.getElementById('nombre_carrera').value.trim();

            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/carreras/${id}` : '/api/carreras';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        codigo,
                        nombre_carrera
                    })
                });

                const data = await res.json();
                if (data.success) {
                    modalCarreraInstance.hide();
                    mostrarAlerta(data.message, 'success');
                    await cargarCarreras();
                } else {
                    mostrarAlerta(data.message || 'Error al guardar', 'danger');
                }
            } catch (err) {
                mostrarAlerta('Error de conexión con el servidor', 'danger');
            }
        }

        async function eliminarCarrera(id) {
            if (!confirm('¿Está seguro de que desea eliminar esta carrera?')) return;

            try {
                const res = await fetch(`/api/carreras/${id}`, {
                    method: 'DELETE'
                });
                const data = await res.json();

                if (data.success) {
                    mostrarAlerta(data.message, 'success');
                    await cargarCarreras();
                } else {
                    mostrarAlerta(data.message || 'Error al eliminar', 'danger');
                }
            } catch (err) {
                mostrarAlerta('Error de conexión con el servidor', 'danger');
            }
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alertaCarrera');
            alerta.className = `alert alert-${tipo}`;
            alerta.textContent = mensaje;
            alerta.classList.remove('d-none');
            setTimeout(() => alerta.classList.add('d-none'), 4000);
        }

        // Cargar el HTML del Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // Consultar y pintar el nombre del usuario en sesión después de cargar el menú
                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });

        // Cargar el HTML del Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    // Consultar y pintar el nombre del usuario en sesión después de cargar el menú
                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });

        function cerrarSesion() {
            window.location.href = '/';
        }
    </script>
</body>

</html>
