<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Correcciones - Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- SweetAlert2 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
</head>

<body style="background-color: #1F91DC !important;">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4 mb-5">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-white"><i class="bi bi-pencil-square me-2"></i>Módulo de Registro de Correcciones</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success" onclick="abrirModalCorreccion()">
                    <i class="bi bi-plus-circle me-1"></i> Registrar Nueva Corrección
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive" style="max-height: 550px; overflow-y: auto;">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark sticky-top" style="top: 0; z-index: 10;">
                            <tr>
                                <th style="width: 50px;">Item</th>
                                <th>Fecha</th>
                                <th>Semestre</th>
                                <th>Alumno</th>
                                <th>Cédula</th>
                                <th>Carrera</th>
                                <th>Tarea</th>
                                <th>Asignatura</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCorrecciones">
                            <tr>
                                <td colspan="9" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL REGISTRAR / EDITAR CORRECCIÓN -->
    <div class="modal fade" id="modalCorreccion" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formCorreccion" onsubmit="guardarCorreccion(event)">
                    <input type="hidden" id="correccionId">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalTitulo">Registrar Nueva Corrección</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">

                        <!-- 1. Búsqueda de Alumno por Combobox -->
                        <div class="mb-3">
                            <label for="selectAlumno" class="form-label fw-semibold">Buscar Alumno</label>
                            <select id="selectAlumno" class="form-select" onchange="seleccionarAlumno(this)" required>
                                <option value="">Seleccione un alumno...</option>
                            </select>
                            <div class="form-text" id="mensajeAlumno">Seleccione un alumno del listado para autocompletar sus datos.</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cedulaAlumno" class="form-label fw-semibold">Cédula</label>
                                <input type="text" class="form-control bg-light" id="cedulaAlumno" placeholder="Cédula" readonly required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="nombreAlumno" class="form-label fw-semibold">Nombre</label>
                                <input type="text" class="form-control bg-light" id="nombreAlumno" placeholder="Nombre" readonly required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="codigoCarrera" class="form-label fw-semibold">Cod Carrera</label>
                                <input type="text" class="form-control bg-light" id="codigoCarrera" placeholder="Cod Carrera" readonly>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="descripcionCarrera" class="form-label fw-semibold">Carrera</label>
                                <input type="text" class="form-control bg-light" id="descripcionCarrera" placeholder="Carrera" readonly>
                            </div>
                        </div>

                        <hr class="my-3">

                        <!-- 2. Selección de Materia (Tabla materiauna) -->
                        <div class="mb-3">
                            <label for="selectMateria" class="form-label fw-semibold">Seleccionar Asignatura</label>
                            <select id="selectMateria" class="form-select" required>
                                <option value="">Seleccione una asignatura...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="codigoMateria" class="form-label fw-semibold">Cod. Asignatura</label>
                                <input type="text" class="form-control bg-light" id="codigoMateria" placeholder="Cod. materia" readonly required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="descripcionMateria" class="form-label fw-semibold">Asignatura</label>
                                <input type="text" class="form-control bg-light" id="descripcionMateria" placeholder="Materia" readonly required>
                            </div>
                        </div>

                        <hr class="my-3">

                        <!-- 3. Selección del Tipo de Tarea -->
                        <div class="mb-3">
                            <label for="selectTarea" class="form-label fw-semibold">Seleccionar Tipo de Tarea</label>
                            <select id="selectTarea" class="form-select" required>
                                <option value="">Seleccione un tipo de tarea...</option>
                            </select>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="codigoTarea" class="form-label fw-semibold">Cod. Tarea</label>
                                <input type="text" class="form-control bg-light" id="codigoTarea" placeholder="Cod. Tarea" readonly required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="descripcionTarea" class="form-label fw-semibold">Tarea</label>
                                <input type="text" class="form-control bg-light" id="descripcionTarea" placeholder="Tarea" readonly required>
                            </div>
                        </div>

                        <hr class="my-3">

                        <!-- 4. Selección de Semestre -->
                        <div class="mb-3">
                            <label for="selectSemestre" class="form-label fw-semibold">Semestre</label>
                            <select id="selectSemestre" class="form-select" required>
                                <option value="">Seleccione el semestre...</option>
                                <option value="2026-2">2026-2</option>
                                <option value="2027-1">2027-1</option>
                                <option value="2027-2">2027-2</option>
                                <option value="2028-1">2028-1</option>
                                <option value="2028-2">2028-2</option>
                            </select>
                        </div>

                        <div class="row">
                            <!-- Asesor (Automático por sesión) -->
                            <div class="col-md-6 mb-3">
                                <label for="nombreAsesor" class="form-label fw-semibold">Asesor Responsable</label>
                                <input type="text" class="form-control bg-light" id="nombreAsesor" readonly required>
                                <input type="hidden" id="cedulaAsesor">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaHora" class="form-label fw-semibold">Fecha</label>
                                <input type="text" class="form-control bg-light" id="fechaHora" readonly required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelar">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar Corrección</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        let modalInstance = null;
        let asesorActual = {};
        let listaAlumnosGlobal = [];
        let listaCarrerasGlobal = [];
        let listaMateriasGlobal = [];
        let listaCorreccionesGlobal = [];

        document.addEventListener("DOMContentLoaded", async() => {
            modalInstance = new bootstrap.Modal(document.getElementById('modalCorreccion'));
            await inicializarDatos();
            await cargarControlCorrecciones();

            // Evento para autocompletar asignatura correctamente con dataset
            document.getElementById('selectMateria').addEventListener('change', function() {
                const opt = this.options[this.selectedIndex];
                document.getElementById('codigoMateria').value = opt.dataset.codigo || this.value || '';
                document.getElementById('descripcionMateria').value = opt.dataset.descripcion || '';
            });

            document.getElementById('selectTarea').addEventListener('change', function() {
                const opt = this.options[this.selectedIndex];
                document.getElementById('codigoTarea').value = opt.dataset.codigo || this.value || '';
                document.getElementById('descripcionTarea').value = opt.dataset.descripcion || '';
            });
        });

        async function inicializarDatos() {
            // 1. Obtener sesión del usuario y datos del Asesor
            try {
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated) {
                    asesorActual = dataUser.user;
                    document.getElementById('nombreAsesor').value = asesorActual.nombre || asesorActual.usuario;
                    document.getElementById('cedulaAsesor').value = asesorActual.cedula;
                } else {
                    window.location.href = '/';
                    return;
                }
            } catch (e) {
                console.error("Error al obtener sesión:", e);
            }

            // 2. Cargar Catálogo de Carreras para cruzar descripciones
            try {
                const resCarreras = await fetch('/api/carreras');
                const resultCarreras = await resCarreras.json();
                listaCarrerasGlobal = resultCarreras.success ? resultCarreras.data : (Array.isArray(resultCarreras) ? resultCarreras : []);
            } catch (err) {
                console.error("Error al cargar carreras:", err);
            }

            // 3. Cargar ComboBox Alumnos
            try {
                const res = await fetch('/api/alumnos');
                const result = await res.json();
                const select = document.getElementById('selectAlumno');
                select.innerHTML = '<option value="">Seleccione un alumno...</option>';
                listaAlumnosGlobal = result.success ? result.data : (Array.isArray(result) ? result : []);

                if (Array.isArray(listaAlumnosGlobal)) {
                    listaAlumnosGlobal.forEach(al => {
                        select.innerHTML += `<option value="${al.cedula}">${al.cedula} - ${al.nombre}</option>`;
                    });
                }
            } catch (err) {
                console.error("Error al cargar alumnos:", err);
            }

            // 4. Cargar ComboBox Materias usando /api/materiauna con dataset asignado
            try {
                const res = await fetch('/api/materiauna');
                const result = await res.json();
                const select = document.getElementById('selectMateria');
                select.innerHTML = '<option value="">Seleccione una asignatura...</option>';
                listaMateriasGlobal = result.success ? result.data : (Array.isArray(result) ? result : []);

                if (Array.isArray(listaMateriasGlobal)) {
                    listaMateriasGlobal.forEach(mat => {
                        const opt = document.createElement('option');
                        opt.value = mat.codigo;
                        opt.textContent = `${mat.codigo} - ${mat.descripcion}`;
                        opt.dataset.codigo = mat.codigo;
                        opt.dataset.descripcion = mat.descripcion;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Error al cargar materiauna:", error);
            }

            // 5. Cargar ComboBox Tareas
            try {
                const res = await fetch('/api/tareas');
                const result = await res.json();
                const select = document.getElementById('selectTarea');
                select.innerHTML = '<option value="">Seleccione un tipo de tarea...</option>';
                const lista = result.success ? result.data : result;
                if (Array.isArray(lista)) {
                    lista.forEach(tar => {
                        const opt = document.createElement('option');
                        opt.value = tar.codigo;
                        opt.textContent = `${tar.codigo} - ${tar.descripcion}`;
                        opt.dataset.codigo = tar.codigo;
                        opt.dataset.descripcion = tar.descripcion;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Error al cargar tareas:", error);
            }
        }

        function seleccionarAlumno(selectElement) {
            const cedulaSeleccionada = selectElement.value;
            const mensajeDiv = document.getElementById('mensajeAlumno');

            if (!cedulaSeleccionada) {
                document.getElementById('cedulaAlumno').value = '';
                document.getElementById('nombreAlumno').value = '';
                document.getElementById('codigoCarrera').value = '';
                document.getElementById('descripcionCarrera').value = '';
                mensajeDiv.textContent = 'Seleccione un alumno del listado para autocompletar sus datos.';
                mensajeDiv.className = 'form-text text-muted';
                return;
            }

            const alumnoEncontrado = listaAlumnosGlobal.find(a => a.cedula === cedulaSeleccionada);

            if (alumnoEncontrado) {
                document.getElementById('cedulaAlumno').value = alumnoEncontrado.cedula || '';
                document.getElementById('nombreAlumno').value = alumnoEncontrado.nombre || '';

                const codCarrera = alumnoEncontrado.codigo_carrera || '';
                document.getElementById('codigoCarrera').value = codCarrera;

                // Buscar la descripción de la carrera por su código
                const carreraEncontrada = listaCarrerasGlobal.find(c => String(c.codigo).trim() === String(codCarrera).trim());
                document.getElementById('descripcionCarrera').value = carreraEncontrada ? (carreraEncontrada.nombre_carrera || carreraEncontrada.descripcion) : (alumnoEncontrado.descripcion_carrera || '');

                mensajeDiv.textContent = '¡Alumno seleccionado correctamente!';
                mensajeDiv.className = 'form-text text-success fw-semibold';
            } else {
                document.getElementById('cedulaAlumno').value = '';
                document.getElementById('nombreAlumno').value = '';
                document.getElementById('codigoCarrera').value = '';
                document.getElementById('descripcionCarrera').value = '';
                mensajeDiv.textContent = 'No se pudieron cargar los datos del alumno seleccionado.';
                mensajeDiv.className = 'form-text text-danger';
            }
        }

        function abrirModalCorreccion() {
            document.getElementById('formCorreccion').reset();
            document.getElementById('correccionId').value = '';
            document.getElementById('modalTitulo').textContent = 'Registrar Nueva Corrección';
            document.getElementById('nombreAsesor').value = asesorActual.nombre || asesorActual.usuario;
            document.getElementById('cedulaAsesor').value = asesorActual.cedula;

            const mensajeAlumno = document.getElementById('mensajeAlumno');
            mensajeAlumno.textContent = 'Seleccione un alumno del listado para autocompletar sus datos.';
            mensajeAlumno.className = 'form-text text-muted';

            const ahora = new Date();
            document.getElementById('fechaHora').value = ahora.toLocaleDateString('es-ES');

            modalInstance.show();
        }

        function editarCorreccion(id) {
            const item = listaCorreccionesGlobal.find(c => c.id == id);
            if (!item) return;

            document.getElementById('formCorreccion').reset();
            document.getElementById('correccionId').value = item.id;
            document.getElementById('modalTitulo').textContent = 'Editar Corrección';

            document.getElementById('selectAlumno').value = item.cedula_alumno || '';
            document.getElementById('cedulaAlumno').value = item.cedula_alumno || '';
            document.getElementById('nombreAlumno').value = item.nombre_alumno || '';
            document.getElementById('codigoCarrera').value = item.codigo_carrera || '';

            // Asignar descripción de carrera
            const carreraEncontrada = listaCarrerasGlobal.find(c => String(c.codigo).trim() === String(item.codigo_carrera).trim());
            document.getElementById('descripcionCarrera').value = carreraEncontrada ? (carreraEncontrada.nombre_carrera || carreraEncontrada.descripcion) : (item.descripcion_carrera || '');

            document.getElementById('selectMateria').value = item.codigo_materia || '';
            document.getElementById('codigoMateria').value = item.codigo_materia || '';
            document.getElementById('descripcionMateria').value = item.descripcion_materia || '';

            document.getElementById('selectTarea').value = item.tipo_correccion || '';
            document.getElementById('codigoTarea').value = item.tipo_correccion || '';
            document.getElementById('descripcionTarea').value = item.descripcion_tarea || '';

            document.getElementById('selectSemestre').value = item.semestre || '';

            document.getElementById('nombreAsesor').value = item.nombre_asesor || asesorActual.nombre;
            document.getElementById('cedulaAsesor').value = item.cedula_asesor || asesorActual.cedula;

            let fechaItem = item.fecha ? new Date(item.fecha) : new Date();
            document.getElementById('fechaHora').value = fechaItem.toLocaleDateString('es-ES');

            const mensajeAlumno = document.getElementById('mensajeAlumno');
            mensajeAlumno.textContent = 'Modificando registro seleccionado.';
            mensajeAlumno.className = 'form-text text-primary fw-semibold';

            modalInstance.show();
        }

        async function eliminarCorreccion(id) {
            Swal.fire({
                title: '¿Estás seguro?',
                text: "¿Deseas eliminar este registro de corrección?",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Sí, eliminar',
                cancelButtonText: 'Cancelar'
            }).then(async(result) => {
                if (result.isConfirmed) {
                    try {
                        const res = await fetch(`/api/control_correcciones/${id}`, {
                            method: 'DELETE'
                        });
                        const dataRes = await res.json();
                        if (dataRes.success) {
                            Swal.fire('¡Eliminado!', 'El registro ha sido eliminado correctamente.', 'success');
                            await cargarControlCorrecciones();
                        } else {
                            Swal.fire('Error', dataRes.message || 'No se pudo eliminar la corrección.', 'error');
                        }
                    } catch (error) {
                        console.error("Error al eliminar:", error);
                        Swal.fire('Error', 'Error de conexión con el servidor.', 'error');
                    }
                }
            });
        }

        async function guardarCorreccion(e) {
            e.preventDefault();
            e.stopPropagation();

            const cedulaAlumno = document.getElementById('cedulaAlumno').value.trim();
            const nombreAlumno = document.getElementById('nombreAlumno').value.trim();
            const codigoMateria = document.getElementById('codigoMateria').value.trim();
            const descripcionMateria = document.getElementById('descripcionMateria').value.trim();
            const semestre = document.getElementById('selectSemestre').value.trim();

            let codigoTarea = document.getElementById('codigoTarea').value.trim();
            const selectTarea = document.getElementById('selectTarea');
            if (!codigoTarea && selectTarea.value) {
                codigoTarea = selectTarea.value;
            }

            let descripcionTarea = document.getElementById('descripcionTarea').value.trim();
            if (!descripcionTarea && selectTarea.selectedIndex > 0) {
                descripcionTarea = selectTarea.options[selectTarea.selectedIndex].dataset.descripcion || '';
            }

            const nombreAsesor = document.getElementById('nombreAsesor').value.trim();
            const fechaHora = document.getElementById('fechaHora').value.trim();

            if (!cedulaAlumno || !nombreAlumno || !codigoMateria || !descripcionMateria || !codigoTarea || !semestre || !nombreAsesor || !fechaHora) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Campos incompletos',
                    text: 'Por favor, complete todos los campos obligatorios incluyendo el semestre.',
                    confirmButtonColor: '#0d6efd'
                });
                return;
            }

            const btnGuardar = document.getElementById('btnGuardar');
            if (btnGuardar.disabled) return;
            btnGuardar.disabled = true;
            btnGuardar.textContent = 'Guardando...';

            const id = document.getElementById('correccionId').value;
            const data = {
                cedula_alumno: cedulaAlumno,
                nombre_alumno: nombreAlumno,
                codigo_carrera: document.getElementById('codigoCarrera').value,
                codigo_materia: codigoMateria,
                tipo_correccion: codigoTarea,
                semestre: semestre,
                cedula_asesor: document.getElementById('cedulaAsesor').value,
                nombre_asesor: nombreAsesor,
                fecha: new Date().toISOString()
            };

            try {
                const url = id ? `/api/control_correcciones/${id}` : '/api/control_correcciones';
                const method = id ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                const result = await res.json();

                if (result.success) {
                    modalInstance.hide();
                    document.getElementById('formCorreccion').reset();
                    await cargarControlCorrecciones();

                    Swal.fire({
                        icon: 'success',
                        title: '¡Guardado exitoso!',
                        text: 'La corrección se ha registrado correctamente.',
                        timer: 2000,
                        showConfirmButton: false
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: result.message || 'Error al guardar la corrección.',
                        confirmButtonColor: '#0d6efd'
                    });
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error de red',
                    text: 'Error de conexión con el servidor.',
                    confirmButtonColor: '#0d6efd'
                });
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.textContent = 'Guardar';
            }
        }

        async function cargarControlCorrecciones() {
            try {
                const res = await fetch('/api/control_correcciones');
                const data = await res.json();
                const tbody = document.getElementById('tablaCorrecciones');
                tbody.innerHTML = '';

                const lista = data.success ? data.data : data;
                listaCorreccionesGlobal = Array.isArray(lista) ? lista : [];

                if (listaCorreccionesGlobal.length > 0) {
                    let itemContador = 1;

                    listaCorreccionesGlobal.forEach(item => {
                        let fechaF = item.fecha ? new Date(item.fecha).toLocaleDateString('es-ES') : '';
                        const tr = document.createElement('tr');

                        const codigoTareaBadge = item.tipo_correccion || '';

                        tr.innerHTML = `
                            <td class="fw-bold text-muted">${itemContador++}</td>
                            <td>${fechaF}</td>
                            <td><span class="badge bg-warning text-dark">${item.semestre || 'N/A'}</span></td>
                            <td>${item.nombre_alumno || ''}</td>
                            <td>${item.cedula_alumno || ''}</td>
                            <td><span class="badge bg-secondary">${item.codigo_carrera || ''}</span></td>
                            <td><span class="badge bg-warning text-dark">${codigoTareaBadge}</span></td>
                            <td><span class="badge bg-info text-dark">${item.codigo_materia || ''}</span></td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-primary me-1" onclick="editarCorreccion(${item.id})" title="Editar"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="eliminarCorreccion(${item.id})" title="Eliminar"><i class="bi bi-trash"></i></button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-4">No hay correcciones registradas.</td></tr>`;
                }

            } catch (error) {
                console.error("Error al cargar control de correcciones:", error);
            }
        }

        // Cargar Navbar dinámicamente
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/views/navbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('navbar-container').innerHTML = data;

                    fetch('/api/user-session')
                        .then(res => res.json())
                        .then(sesion => {
                            const spanUsuario = document.getElementById('nombreUsuario');
                            if (spanUsuario && sesion.authenticated && sesion.user) {
                                spanUsuario.textContent = sesion.user.nombre || sesion.user.usuario;
                            }
                        })
                        .catch(err => console.error("Error al obtener sesión de usuario:", err));
                })
                .catch(err => console.error("Error al cargar el navbar:", err));
        });
    </script>
</body>

</html>
