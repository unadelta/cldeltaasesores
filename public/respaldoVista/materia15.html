<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Asignaturas - Sistema Asesores UNA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .objetivos-horizontal {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 0;
        }
        
        .badge-objetivo {
            font-size: 0.75rem;
            padding: 4px 6px;
        }
        
        .modal-dialog-scrollable .modal-content {
            max-height: 90vh;
            overflow: hidden;
        }
        
        .modal-dialog-scrollable .modal-body {
            max-height: calc(90vh - 120px);
            overflow-y: auto;
        }
        
        .form-control[readonly] {
            background-color: #e9ecef;
            opacity: 1;
        }
    </style>
</head>

<body class="bg-light">

    <!-- NAVBAR PRINCIPAL -->
    <div id="navbar-container"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="container mt-4 mb-5">
        <div class="row mb-3 align-items-center">
            <div class="col-sm-6">
                <h3 class="fw-bold text-primary"><i class="bi bi-book me-2"></i>Módulo de Asignaturas</h3>
            </div>
            <div class="col-sm-6 text-sm-end mt-2 mt-sm-0">
                <button class="btn btn-success" onclick="abrirModalCrear()">
                    <i class="bi bi-plus-circle me-1"></i> Nueva Asignatura
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-primary">
                            <tr>
                                <th>Código</th>
                                <th>Descripción</th>
                                <th>Semestre</th>
                                <th>Nro. Objetivos</th>
                                <th>Mín. Aprobatorio</th>
                                <th>Pesos por Objetivo</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaMaterias">
                            <tr>
                                <td colspan="7" class="text-center text-muted py-4">Cargando registros...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ÚNICO (Crear/Editar) -->
    <div class="modal fade" id="modalMateria" tabindex="-1" aria-labelledby="modalMateriaLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <form id="formMateria" onsubmit="guardarMateria(event)">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="modalMateriaLabel">Registrar Nueva Asignatura</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="materiaOriginalCodigo" value="">

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="codigo_select" class="form-label fw-semibold">Seleccione la Asignatura (Catálogo UNA)</label>
                                <select class="form-select" id="codigo_select" required onchange="autocompletarMateria()">
                                    <option value="" selected disabled>Cargando catálogo...</option>
                                </select>
                                <div class="form-text text-muted small">Seleccione una opción para autocompletar los campos.</div>
                            </div>

                            <div class="col-md-6">
                                <div class="row g-2">
                                    <div class="col-md-4">
                                        <label for="codigo_visualizar" class="form-label fw-semibold small text-muted">Código</label>
                                        <input type="text" class="form-control bg-light" id="codigo_visualizar" readonly placeholder="---">
                                    </div>
                                    <div class="col-md-8">
                                        <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                                        <input type="text" class="form-control bg-light" id="descripcion" required readonly placeholder="--- Autocompletar ---">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="numobj" class="form-label fw-semibold">Número de Objetivos (1-20)</label>
                                <input type="number" class="form-control" id="numobj" min="1" max="20" required oninput="generarCamposDinamicos()" placeholder="Ej. 8">
                            </div>
                            <div class="col-md-4">
                                <label for="minaprueba" class="form-label fw-semibold">Mínimo Aprobatorio</label>
                                <input type="number" step="0.01" class="form-control" id="minaprueba" required placeholder="Ej. 9.5">
                            </div>
                            <div class="col-md-4">
                                <label for="semestre" class="form-label fw-semibold">Semestre</label>
                                <input type="text" class="form-control" id="semestre" required placeholder="Ej. 2026-1" pattern="^\d{4}-[1-2]$">
                                <div class="form-text text-muted small">Formato: 2026-1, 2026-2, etc.</div>
                            </div>
                        </div>

                        <hr>

                        <div id="contenedorPesos" class="mt-3 p-3 border rounded bg-light d-none">
                            <label class="form-label fw-bold text-primary mb-3"><i class="bi bi-sliders me-1"></i> Peso Específico de Cada Objetivo:</label>
                            <div id="listaPesos" class="row g-3"></div>
                        </div>

                        <hr>

                        <div id="contenedorCalificaciones" class="mt-3 p-3 border rounded bg-white shadow-sm d-none">
                            <label class="form-label fw-bold text-primary mb-2"><i class="bi bi-award me-1"></i> Escala de Calificaciones:</label>
                            <div class="table-responsive">
                                <table class="table table-bordered table-sm align-middle text-center mb-2">
                                    <thead class="table-secondary">
                                        <tr>
                                            <th>Peso Acumulado</th>
                                            <th>Calificación Definitiva</th>
                                            <th style="width: 60px;">Acción</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tablaEscalaCalificaciones"></tbody>
                                </table>
                            </div>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="agregarFilaCalificacion()">
                                <i class="bi bi-plus-circle me-1"></i> Agregar Criterio
                            </button>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar Asignatura</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let modalMateriaInstance = null;
        let listaMateriasGestionadasGlobal = [];
        let catalogoMateriasGlobal = [];
        let cedulaAsesorGlobal = '';

        document.addEventListener("DOMContentLoaded", async() => {
            modalMateriaInstance = new bootstrap.Modal(document.getElementById('modalMateria'));
            await cargarNavbar();

            try {
                const res = await fetch('/api/user-session');
                const data = await res.json();
                if (data.authenticated) {
                    cedulaAsesorGlobal = String(data.user.cedula || data.user.id || '').trim();
                    await inicializarCatalogo();
                    await cargarMaterias();
                } else {
                    window.location.href = '/';
                }
            } catch (err) {
                console.error("Error crítico:", err);
                window.location.href = '/';
            }
        });

        async function cargarNavbar() {
            try {
                const response = await fetch('/views/navbar.html');
                if (response.ok) {
                    document.getElementById('navbar-container').innerHTML = await response.text();
                }
            } catch (err) {
                console.error("Error al cargar el navbar:", err);
            }
        }

        async function inicializarCatalogo() {
            const selectCodigo = document.getElementById('codigo_select');
            if (!selectCodigo) return;

            selectCodigo.innerHTML = '<option value="" selected disabled>Cargando catálogo...</option>';

            try {
                const res = await fetch('/api/materiauna');
                const data = await res.json();

                if (data.success && Array.isArray(data.data)) {
                    catalogoMateriasGlobal = data.data.filter(mat => String(mat.cedula_asesor || "").trim() === cedulaAsesorGlobal);

                    if (catalogoMateriasGlobal.length === 0) {
                        selectCodigo.innerHTML = '<option value="" selected disabled>No tiene asignaturas asociadas en el catálogo</option>';
                        return;
                    }

                    selectCodigo.innerHTML = '<option value="" selected disabled>Seleccione una asignatura...</option>';
                    catalogoMateriasGlobal.forEach(mat => {
                        selectCodigo.innerHTML += `<option value="${mat.codigo}">${mat.codigo} - ${mat.descripcion}</option>`;
                    });
                } else {
                    selectCodigo.innerHTML = '<option value="" selected disabled>Error al cargar catálogo</option>';
                }
            } catch (err) {
                console.error("Error conexión catálogo:", err);
                selectCodigo.innerHTML = '<option value="" selected disabled>Error de conexión</option>';
            }
        }

        function autocompletarMateria() {
            const selectCodigo = document.getElementById('codigo_select');
            const materiaEncontrada = catalogoMateriasGlobal.find(m => m.codigo == selectCodigo.value);
            if (materiaEncontrada) {
                document.getElementById('descripcion').value = materiaEncontrada.descripcion;
                document.getElementById('codigo_visualizar').value = materiaEncontrada.codigo;
            }
        }

        async function cargarMaterias() {
            const tbody = document.getElementById('tablaMaterias');
            if (!tbody) return;
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Cargando materias gestionadas...</td></tr>';

            try {
                const res = await fetch('/api/materias');
                const data = await res.json();
                tbody.innerHTML = '';

                if (data.success && Array.isArray(data.data)) {
                    listaMateriasGestionadasGlobal = data.data.filter(m => String(m.cedula_asesor || "").trim() === cedulaAsesorGlobal);

                    if (listaMateriasGestionadasGlobal.length === 0) {
                        tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">No hay materias gestionadas registradas para este asesor.</td></tr>`;
                        return;
                    }

                    listaMateriasGestionadasGlobal.forEach(materia => {
                        const minAprob = materia.minaprueba !== null ? parseFloat(materia.minaprueba).toFixed(2) : '-';
                        const semestreVal = materia.semestre || '-';

                        let objetivosHtml = '<span class="text-muted fst-italic">Sin objetivos</span>';
                        if (Array.isArray(materia.objetivos) && materia.objetivos.length > 0) {
                            objetivosHtml = '<div class="objetivos-horizontal">';
                            materia.objetivos.sort((a, b) => a.nro_objetivo - b.nro_objetivo);
                            materia.objetivos.forEach(obj => {
                                objetivosHtml += `<span class="badge bg-secondary badge-objetivo">O${obj.nro_objetivo}: <strong>${parseFloat(obj.peso).toFixed(2)}</strong></span>`;
                            });
                            objetivosHtml += '</div>';
                        }

                        tbody.innerHTML += `
                            <tr>
                                <td class="fw-bold">${materia.codigo}</td>
                                <td>${materia.descripcion}</td>
                                <td class="text-center"><span class="badge bg-info text-dark">${semestreVal}</span></td>
                                <td class="text-center">${materia.numobj || '-'}</td>
                                <td class="text-center">${minAprob}</td>
                                <td>${objetivosHtml}</td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1" onclick="abrirModalEditar('${materia.codigo}')" title="Editar">
                                        <i class="bi bi-pencil-square"></i>
                                    </button>
                                    <button class="btn btn-sm btn-outline-danger" onclick="eliminarMateria('${materia.codigo}')" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error al cargar materias gestionadas.</td></tr>`;
                }
            } catch (err) {
                console.error("Error conexión materias:", err);
                tbody.innerHTML = `<tr><td colspan="7" class="text-center text-danger py-4">Error de conexión al servidor.</td></tr>`;
            }
        }

        function abrirModalCrear() {
            document.getElementById('formMateria').reset();
            document.getElementById('modalMateriaLabel').textContent = 'Registrar Nueva Asignatura';
            document.getElementById('materiaOriginalCodigo').value = '';
            document.getElementById('codigo_select').disabled = false;
            document.getElementById('contenedorPesos').classList.add('d-none');
            document.getElementById('contenedorCalificaciones').classList.add('d-none');
            document.getElementById('listaPesos').innerHTML = '';
            document.getElementById('tablaEscalaCalificaciones').innerHTML = '';
            modalMateriaInstance.show();
        }

        function abrirModalEditar(codigoMateria) {
            const materia = listaMateriasGestionadasGlobal.find(m => m.codigo === codigoMateria);
            if (!materia) return;

            document.getElementById('formMateria').reset();
            document.getElementById('modalMateriaLabel').textContent = `Editar Asignatura: ${materia.codigo}`;

            const selectCodigo = document.getElementById('codigo_select');
            selectCodigo.innerHTML = `<option value="${materia.codigo}" selected>${materia.codigo} - ${materia.descripcion}</option>`;
            selectCodigo.disabled = true;

            document.getElementById('codigo_visualizar').value = materia.codigo;
            document.getElementById('descripcion').value = materia.descripcion;
            document.getElementById('semestre').value = materia.semestre || '';
            document.getElementById('materiaOriginalCodigo').value = materia.codigo;
            document.getElementById('minaprueba').value = materia.minaprueba;
            document.getElementById('numobj').value = materia.numobj;

            generarCamposDinamicos();

            if (Array.isArray(materia.objetivos)) {
                materia.objetivos.forEach(obj => {
                    const inputObj = document.querySelector(`.peso-input[data-obj="${obj.nro_objetivo}"]`);
                    if (inputObj) inputObj.value = obj.peso;
                });
            }

            const tablaCal = document.getElementById('tablaEscalaCalificaciones');
            tablaCal.innerHTML = '';
            if (Array.isArray(materia.calificaciones)) {
                materia.calificaciones.forEach(cal => {
                    agregarFilaCalificacion(cal.peso_acumulado, cal.calificacion);
                });
            }

            modalMateriaInstance.show();
        }

        function generarCamposDinamicos() {
            const numObj = parseInt(document.getElementById('numobj').value);
            const contenedorPesos = document.getElementById('contenedorPesos');
            const listaPesos = document.getElementById('listaPesos');
            const contenedorCal = document.getElementById('contenedorCalificaciones');
            const tablaCal = document.getElementById('tablaEscalaCalificaciones');

            if (numObj >= 1 && numObj <= 20) {
                contenedorPesos.classList.remove('d-none');
                listaPesos.innerHTML = '';
                for (let i = 1; i <= numObj; i++) {
                    listaPesos.innerHTML += `
                        <div class="col-md-3 col-sm-4">
                            <label class="form-label small fw-semibold mb-1">Obj ${i}:</label>
                            <input type="number" step="0.01" class="form-control form-control-sm peso-input" data-obj="${i}" required placeholder="Peso ${i}">
                        </div>`;
                }
                contenedorCal.classList.remove('d-none');

                // Generar filas por defecto si la tabla está vacía
                if (tablaCal && tablaCal.children.length === 0) {
                    for (let i = 0; i < 5; i++) {
                        agregarFilaCalificacion();
                    }
                }
            } else {
                contenedorPesos.classList.add('d-none');
                contenedorCal.classList.add('d-none');
                if (listaPesos) listaPesos.innerHTML = '';
                if (tablaCal) tablaCal.innerHTML = '';
            }
        }

        function agregarFilaCalificacion(pesoVal = '', califVal = '') {
            const tablaCal = document.getElementById('tablaEscalaCalificaciones');
            if (!tablaCal) return;
            const fila = document.createElement('tr');
            fila.innerHTML = `
                <td><input type="number" step="0.01" class="form-control form-control-sm text-center calif-peso" value="${pesoVal}" required placeholder="Ej. 35.00"></td>
                <td><input type="number" step="0.01" class="form-control form-control-sm text-center calif-valor" value="${califVal}" required placeholder="Ej. 9.50"></td>
                <td><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
            `;
            tablaCal.appendChild(fila);
        }

        async function guardarMateria(e) {
            e.preventDefault();
            const codigoOriginal = document.getElementById('materiaOriginalCodigo').value;
            const esEdicion = codigoOriginal !== "";
            const codigo = esEdicion ? codigoOriginal : document.getElementById('codigo_select').value;
            const descripcion = document.getElementById('descripcion').value.trim();
            const numobj = parseInt(document.getElementById('numobj').value);
            const minaprueba = parseFloat(document.getElementById('minaprueba').value);
            const semestre = document.getElementById('semestre').value.trim();

            const objetivos = [];
            document.querySelectorAll('.peso-input').forEach(input => {
                let valorLimpio = input.value.replace(',', '.');
                objetivos.push({
                    nro_objetivo: parseInt(input.dataset.obj),
                    peso: parseFloat(valorLimpio) || 0
                });
            });

            const calificaciones = [];
            document.querySelectorAll('#tablaEscalaCalificaciones tr').forEach(fila => {
                const pesoVal = fila.querySelector('.calif-peso').value.replace(',', '.');
                const califVal = fila.querySelector('.calif-valor').value.replace(',', '.');
                calificaciones.push({
                    peso_acumulado: parseFloat(pesoVal) || 0,
                    calificacion: parseFloat(califVal) || 0
                });
            });

            const payload = {
                codigo,
                descripcion,
                minaprueba,
                numobj,
                semestre,
                cedula: cedulaAsesorGlobal,
                objetivos,
                calificaciones
            };

            try {
                const url = esEdicion ? `/api/materias/${codigoOriginal}` : '/api/materias';
                const method = esEdicion ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (data.success) {
                    Swal.fire('¡Éxito!', 'Asignatura guardada correctamente.', 'success', 2000);
                    modalMateriaInstance.hide();
                    await cargarMaterias();
                } else {
                    Swal.fire('Error', data.message || 'No se pudo guardar.', 'error');
                }
            } catch (err) {
                console.error(err);
                Swal.fire('Error', 'Error de conexión.', 'error');
            }
        }

        async function eliminarMateria(codigo) {
            const result = await Swal.fire({
                title: '¿Estás seguro?',
                text: `Se eliminará la asignatura ${codigo} y todos sus datos asociados.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                confirmButtonText: 'Sí, eliminar'
            });

            if (result.isConfirmed) {
                const res = await fetch(`/api/materias/${codigo}`, {
                    method: 'DELETE'
                });
                const data = await res.json();
                if (data.success) {
                    Swal.fire('Eliminado', 'Asignatura borrada.', 'success');
                    await cargarMaterias();
                }
            }
        }
    </script>
</body>

</html>
