<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Control de Asesorías - UNA Delta Amacuro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

    <style>
        /* Configuración de página: Carta Horizontal y márgenes */
        
        @page {
            size: letter landscape;
            margin: 0;
            /* Eliminamos márgenes del navegador para control total */
        }
        
        body {
            background-color: #f8f9fa;
            color: #212529;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        /* Contenedor principal de la hoja, usando CSS Grid para forzar el flujo */
        
        .page-container {
            background: white;
            width: 279mm;
            height: 215mm;
            /* Alto exacto de hoja carta */
            margin: 10px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            /* ESTRUCTURA CSS GRID */
            display: grid;
            grid-template-columns: 1fr;
            /* Área A: Header (fijo), Área B: Datos (ocupa el resto), Área C: Footer (fijo) */
            grid-template-rows: 55mm 140mm 20mm;
            grid-template-areas: "header" "data" "footer";
            padding: 5mm;
            /* Padding interno global respecto a los bordes de la hoja */
            /* Control de paginación estricto */
            page-break-after: always;
            page-break-inside: avoid;
            overflow: hidden;
            position: relative;
        }
        /* Ocultar barra de acciones al imprimir */
        
        @media print {
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                /* Forzar impresión de fondos */
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .page-container {
                box-shadow: none;
                margin: 0;
                /* Aseguramos que el tamaño de la hoja se mantenga al imprimir */
                width: 279mm !important;
                height: 215mm !important;
            }
        }
        /* 1. ÁREA DEL ENCABEZADO (Fija) */
        
        .header-container {
            grid-area: header;
            border-bottom: 2px solid #0d6efd;
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10mm;
            /* Padding lateral interno del header */
        }
        
        .logo-una {
            max-height: 45px;
            object-fit: contain;
        }
        
        .institution-title h4 {
            margin: 0;
            font-weight: bold;
            color: #0d6efd;
            font-size: 1.1rem;
        }
        
        .institution-title h5 {
            margin: 1px 0 0 0;
            color: #495057;
            font-size: 0.9rem;
            font-weight: 600;
        }
        /* 2. ÁREA DE DATOS (Flexible) */
        
        .data-container {
            grid-area: data;
            display: flex;
            flex-direction: column;
            font-size: 0.73rem;
            /* Fuente ligeramente más compacta para asegurar que quepan 18 filas */
            overflow: hidden;
            padding: 0 10mm;
            /* Padding lateral interno del área de datos */
        }
        /* Estilo de la tabla interna de datos */
        
        .table-report {
            width: 100%;
            margin-bottom: 0;
            border-collapse: collapse;
        }
        
        .table-report th {
            background-color: #0d6efd !important;
            color: white;
            text-align: center;
            padding: 4px;
            font-weight: 600;
            border: 1px solid #dee2e6;
        }
        
        .table-report td {
            padding: 3px 4px;
            vertical-align: middle;
            border: 1px solid #dee2e6;
            line-height: 1.1;
        }
        /* Filas intercaladas (Efecto cebra) */
        
        .table-report tbody tr:nth-child(odd) {
            background-color: #fdfdfd;
        }
        
        .table-report tbody tr:nth-child(even) {
            background-color: #f1f4f9;
        }
        /* 3. ÁREA DEL PIE DE PÁGINA (Fijo y anclado al fondo del grid) */
        
        .report-footer {
            grid-area: footer;
            border-top: 1px solid #ced4da;
            font-size: 0.75rem;
            background-color: white;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            align-items: end;
            /* Alinea el contenido al fondo de este bloque de 20mm */
            text-align: center;
            padding: 2px 10mm;
            /* Padding lateral interno del footer */
        }
        
        .signature-line {
            border-top: 1px solid #333;
            width: 85%;
            margin: 15px auto 2px auto;
        }
        /* Asegurar que las clases de Bootstrap no interfieran con la rejilla */
        
        .table-responsive {
            overflow: visible;
        }
    </style>
</head>

<body>

    <!-- BARRA DE ACCIONES (No sale en impresión) -->
    <div class="container my-3 no-print d-flex justify-content-between align-items-center">
        <a href="/dashboard" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Volver al Dashboard</a>
        <button onclick="window.print()" class="btn btn-primary"><i class="bi bi-printer-fill me-1"></i> Imprimir Reporte / Guardar PDF</button>
    </div>

    <!-- CONTENEDOR DINÁMICO DE PÁGINAS -->
    <div id="contenedorPaginas">
        <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Cargando y organizando datos del reporte...</p>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let nombreAsesorActual = "Asesor";

        document.addEventListener("DOMContentLoaded", async() => {
            await cargarSesionYDatos();
        });

        async function cargarSesionYDatos() {
            try {
                // 1. Obtener datos del usuario logueado
                const resUser = await fetch('/api/user-session');
                const dataUser = await resUser.json();
                if (dataUser.authenticated && dataUser.user) {
                    nombreAsesorActual = dataUser.user.nombre || "Asesor";
                }

                // 2. Obtener registros de la tabla controlasesoria
                const resAsesorias = await fetch('/api/controlasesoria');
                const dataAsesorias = await resAsesorias.json();

                // Asegurarse de extraer el array de datos correctamente
                const lista = Array.isArray(dataAsesorias) ? dataAsesorias : (dataAsesorias.data || dataAsesorias.resultado || []);

                generarPaginasReporte(lista);

            } catch (err) {
                console.error("Error al cargar datos para el reporte:", err);
                document.getElementById('contenedorPaginas').innerHTML = `
                    <div class="alert alert-danger text-center m-4">
                        Error al conectar con el servidor o cargar la tabla <strong>controlasesoria</strong>.<br>
                        Detalles: ${err.message}
                    </div>`;
            }
        }

        function generarPaginasReporte(datos) {
            const contenedor = document.getElementById('contenedorPaginas');
            contenedor.innerHTML = '';

            if (datos.length === 0) {
                contenedor.innerHTML = `<div class="text-center text-muted py-5 bg-white shadow-sm m-4">No se encontraron registros en la tabla controlasesoria.</div>`;
                return;
            }

            // --- MODIFICACIÓN AQUÍ ---
            // LÍMITE ESTRICTO DE ÍTEMS POR PÁGINA REDUCIDO A 18 PARA ASEGURAR QUE EL FOOTER QUEPA
            const itemsPorPagina = 18;
            const totalPaginas = Math.ceil(datos.length / itemsPorPagina);

            for (let i = 0; i < totalPaginas; i++) {
                const inicio = i * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const chunk = datos.slice(inicio, fin);

                let filasHTML = '';
                chunk.forEach((item) => {
                    // Formatear fecha y hora si viene en formato ISO
                    let fechaFormateada = item.fecha_hora || item.fecha || 'N/D';
                    if (fechaFormateada !== 'N/D' && fechaFormateada.includes('T')) {
                        // Convertir formato ISO (YYYY-MM-DDTHH:mm:ss) a DD/MM/AAAA HH:mm
                        const fechaObj = new Date(fechaFormateada);
                        if (!isNaN(fechaObj.getTime())) {
                            const dia = String(fechaObj.getDate()).padStart(2, '0');
                            const mes = String(fechaObj.getMonth() + 1).padStart(2, '0'); // Enero es 0
                            const anio = fechaObj.getFullYear();
                            const horas = String(fechaObj.getHours()).padStart(2, '0');
                            const minutos = String(fechaObj.getMinutes()).padStart(2, '0');
                            fechaFormateada = `${dia}/${mes}/${anio} ${horas}:${minutos}`;
                        }
                    }

                    filasHTML += `
                        <tr>
                            <td class="text-center fw-semibold">${item.id}</td>
                            <td class="text-center">${item.cedula_alumno || ''}</td>
                            <td class="text-center"><span class="badge bg-light text-dark border">${item.codigo_carrera || ''}</span></td>
                            <td>${item.tipo_asesoria || ''}</td>
                            <td class="text-center"><span class="badge bg-secondary">${item.codigo_materia || ''}</span></td>
                            <td class="text-center">${fechaFormateada}</td>
                        </tr>
                    `;
                });

                // Construir la estructura visual de la hoja carta horizontal usando el GRID definido en CSS
                const paginaDiv = document.createElement('div');
                paginaDiv.className = 'page-container';
                paginaDiv.innerHTML = `
                    <!-- 1. ÁREA DEL ENCABEZADO -->
                    <div class="header-container">
                        <div class="col-8 d-flex align-items-center">
                            <img src="/jpg/logouna.jpg" alt="Logo UNA" class="logo-una me-3" onerror="this.style.display='none'">
                            <div class="institution-title">
                                <h4>Universidad Nacional Abierta</h4>
                                <h5>Centro Local Delta Amacuro</h5>
                            </div>
                        </div>
                        <div class="col-4 text-end">
                            <span class="text-primary fw-bold fs-6">CONTROL DE ASESORÍAS</span>
                            <div class="text-muted" style="font-size: 0.75rem;">Emitido: ${new Date().toLocaleDateString()}</div>
                        </div>
                    </div>

                    <!-- 2. ÁREA DE DATOS -->
                    <div class="data-container">
                        <div class="table-responsive">
                            <table class="table table-bordered table-report align-middle">
                                <thead>
                                    <tr>
                                        <th style="width: 8%;">ID</th>
                                        <th style="width: 18%;">Cédula</th>
                                        <th style="width: 16%;">Carrera</th>
                                        <th style="width: 26%;">Tipo Asesoría</th>
                                        <th style="width: 16%;">Materia</th>
                                        <th style="width: 16%;">Fecha y Hora</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${filasHTML}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- 3. ÁREA DEL PIE DE PÁGINA (Anclado al fondo por el grid) -->
                    <div class="report-footer">
                        <div class="row align-items-end text-center w-100 m-0">
                            <!-- Firma Asesor de la sesión -->
                            <div class="col-4 p-0">
                                <div class="signature-line"></div>
                                <div class="fw-bold text-truncate">${nombreAsesorActual}</div>
                                <div class="text-muted small">Asesor</div>
                            </div>

                            <!-- Firma Jefa de Unidad Académica -->
                            <div class="col-4 p-0">
                                <div class="signature-line"></div>
                                <div class="fw-bold">Dra. Yovinsa Salazar</div>
                                <div class="text-muted small">Jefa de la Unidad Académica</div>
                            </div>

                            <!-- Número de Página a la derecha -->
                            <div class="col-4 text-end text-muted small pb-2 p-0">
                                Página ${i + 1} de ${totalPaginas}
                            </div>
                        </div>
                    </div>
                `;

                contenedor.appendChild(paginaDiv);
            }
        }
    </script>
</body>

</html>
